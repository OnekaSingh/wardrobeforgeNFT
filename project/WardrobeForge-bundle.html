<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WardrobeForge — Every Thread, A Twin</title>
<link rel="icon" href="assets/logo.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* ============= WardrobeForge — pixel game UI ============= */

@font-face {
  font-family: 'PressStart';
  src: url('https://fonts.gstatic.com/s/pressstart2p/v15/e3t4euO8T-267oIAQAu6jDQyK3nVivM.woff2') format('woff2');
  font-display: swap;
}

:root{
  --coral:#F85646;
  --coral-deep:#D43A2C;
  --coral-soft:#FF7E70;
  --pink:#DCC7C7;
  --pink-soft:#F2E3E3;
  --pink-neon:#FFB8C8;
  --mint:#B8F2D8;
  --sky:#A8DEFF;
  --lemon:#FFE9A8;
  --lavender:#D4B8FF;
  --white:#FFFFFF;
  --ink:#2A1B1B;
  --ink-2:#333333;
  --paper:#FFF7F2;
  --paper-2:#F8E9E5;
  --shadow:#2A1B1B;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  font-family: 'VT323', 'Courier New', monospace;
  background: var(--paper);
  color: var(--ink);
  font-size: 22px;
  line-height: 1.25;
  image-rendering: pixelated;
  -webkit-font-smoothing: none;
  font-smooth: never;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
  display: none;
}

img{image-rendering: pixelated; image-rendering:-moz-crisp-edges;}

a{color:inherit; text-decoration:none}

/* ----- pixel utility classes ----- */
.pixel{font-family:'PressStart', 'VT323', monospace; letter-spacing:.02em}
.mono{font-family:'VT323', monospace}

/* checkered dithered background */
.dither-bg{
  background-color: var(--paper);
  background-image:
    linear-gradient(45deg, var(--paper-2) 25%, transparent 25%),
    linear-gradient(-45deg, var(--paper-2) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--paper-2) 75%),
    linear-gradient(-45deg, transparent 75%, var(--paper-2) 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.cloud-bg{
  background:
    radial-gradient(ellipse at 10% 20%, var(--pink-neon) 0%, transparent 30%),
    radial-gradient(ellipse at 90% 30%, var(--sky) 0%, transparent 32%),
    radial-gradient(ellipse at 30% 80%, var(--lemon) 0%, transparent 28%),
    radial-gradient(ellipse at 80% 90%, var(--lavender) 0%, transparent 30%),
    var(--paper);
}

/* chunky pixel border via box-shadow stair-step */
.pxl-box{
  background: var(--white);
  position:relative;
  box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink),
    0 8px 0 0 var(--coral);
}
.pxl-box.no-drop{ box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink);
}
.pxl-box.deep{
  box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink),
    8px 8px 0 0 var(--ink),
    8px 8px 0 4px var(--coral);
}
.pxl-box.coral{ background: var(--coral); color: var(--white) }
.pxl-box.pink{ background: var(--pink); }
.pxl-box.dark{ background: var(--ink); color: var(--white) }

/* pixel button */
.pxl-btn{
  font-family:'PressStart', monospace;
  font-size: 12px;
  letter-spacing:.04em;
  background: var(--coral);
  color: var(--white);
  border:none;
  padding: 14px 18px;
  cursor:pointer;
  position:relative;
  text-transform:uppercase;
  box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink),
    0 8px 0 0 var(--coral-deep);
  transition: transform .08s steps(2);
}
.pxl-btn:hover{ filter: brightness(1.05) }
.pxl-btn:active{ transform: translateY(4px); box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink);
}
.pxl-btn.ghost{ background: var(--white); color: var(--ink); box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink),
    0 8px 0 0 var(--pink);
}
.pxl-btn.ghost:active{ transform: translateY(4px); box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink);
}

/* sparkle pulse */
@keyframes sparkle{
  0%,100%{opacity:1; transform:scale(1)}
  50%{opacity:.4; transform:scale(.7)}
}
.sparkle{ animation: sparkle 1.6s steps(4) infinite }

/* float */
@keyframes floaty{
  0%,100%{transform: translateY(0)}
  50%{transform: translateY(-6px)}
}
.float{ animation: floaty 2.4s steps(8) infinite }

/* twinkle */
@keyframes twinkle{
  0%,100%{opacity:.2}
  50%{opacity:1}
}
.twinkle{ animation: twinkle 1.4s steps(3) infinite }

/* press-start glitch */
@keyframes blink{ 50%{opacity:0} }
.blink{ animation: blink 1s steps(2) infinite }

/* scanline overlay (subtle) */
.scanlines::after{
  content:'';
  position:absolute; inset:0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,.05) 0 2px,
    transparent 2px 4px
  );
  pointer-events:none;
  mix-blend-mode: multiply;
}

/* nav */
.nav{
  position: sticky; top:0; z-index:50;
  background: var(--white);
  border-bottom: 4px solid var(--ink);
  padding: 14px 24px;
  display:flex; align-items:center; gap: 18px;
  flex-wrap: wrap;
}
.nav .logo{
  display:flex; align-items:center; gap:10px;
  cursor:pointer;
}
.nav .logo img{ width: 38px; height:38px }
.nav .logo span{ font-family:'PressStart', monospace; font-size:14px }
.nav .links{ display:flex; gap: 6px; flex-wrap:wrap; margin-left:auto }
.nav .link{
  font-family:'PressStart', monospace;
  font-size:10px;
  padding: 10px 12px;
  cursor:pointer;
  letter-spacing:.04em;
  color: var(--ink);
  border: 3px solid transparent;
  text-transform: uppercase;
}
.nav .link:hover{ background: var(--paper-2) }
.nav .link.active{
  background: var(--ink);
  color: var(--white);
  border-color: var(--ink);
  box-shadow: 0 4px 0 0 var(--coral);
}

/* page wrap */
.page{
  max-width: 1240px; margin: 0 auto;
  padding: 36px 24px 80px;
}

.avatar-inventory-grid{
  overflow-x: hidden;
  box-sizing: border-box;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.avatar-inventory-grid::-webkit-scrollbar{
  display: none;
}

.avatar-page-grid{
  align-items: start;
}

/* footer */
.foot{
  border-top: 4px solid var(--ink);
  background: var(--ink); color: var(--white);
  padding: 28px 24px;
  text-align:center;
  font-family:'PressStart', monospace;
  font-size: 10px;
  letter-spacing:.06em;
}
.foot a{ color: var(--coral-soft); margin: 0 8px }

/* heading styles */
h1.pixel{ font-size: 28px; line-height:1.2; }
h2.pixel{ font-size: 18px; line-height:1.3; }
h3.pixel{ font-size: 12px; line-height:1.4; letter-spacing:.06em }

.heart{color:var(--coral)}

/* hr - dotted pixel */
.pxl-hr{
  height: 4px;
  background-image: linear-gradient(to right, var(--ink) 50%, transparent 50%);
  background-size: 12px 4px;
  background-repeat: repeat-x;
  border: none;
  margin: 16px 0;
}

/* tag chip */
.chip{
  font-family:'PressStart', monospace;
  font-size: 9px;
  padding: 6px 8px;
  background: var(--ink);
  color: var(--white);
  display:inline-block;
  letter-spacing:.04em;
}
.chip.coral{ background: var(--coral) }
.chip.pink{ background: var(--pink); color: var(--ink) }
.chip.mint{ background: var(--mint); color: var(--ink) }
.chip.sky{ background: var(--sky); color: var(--ink) }
.chip.lemon{ background: var(--lemon); color: var(--ink) }
.chip.lavender{ background: var(--lavender); color: var(--ink) }

/* health/xp bar */
.bar{
  height: 14px;
  background: var(--ink);
  position: relative;
  border: 2px solid var(--ink);
}
.bar > i{
  display:block; height: 100%;
  background: linear-gradient(to right, var(--coral) 0%, var(--coral-soft) 100%);
}
.bar.green > i{ background: linear-gradient(to right, #6BCB77, var(--mint)) }
.bar.blue > i{ background: linear-gradient(to right, #4D9DE0, var(--sky)) }
.bar.purple > i{ background: linear-gradient(to right, #8E5CF7, var(--lavender)) }

/* select / radio pixel chips */
.opts{ display:flex; flex-wrap:wrap; gap:6px }
.opt{
  font-family:'PressStart', monospace;
  font-size: 9px;
  padding: 8px 10px;
  border: 3px solid var(--ink);
  background: var(--white);
  cursor:pointer;
  text-transform:uppercase;
}
.opt:hover{ background: var(--paper-2) }
.opt.active{ background: var(--ink); color: var(--white) }
.opt.coral.active{ background: var(--coral) }

/* card grid */
.grid{
  display:grid; gap: 28px;
}
.grid.cols-3{ grid-template-columns: repeat(3, minmax(0,1fr)) }
.grid.cols-4{ grid-template-columns: repeat(4, minmax(0,1fr)) }
.grid.cols-2{ grid-template-columns: repeat(2, minmax(0,1fr)) }
@media (max-width: 900px){
  .grid.cols-3, .grid.cols-4{ grid-template-columns: repeat(2, minmax(0,1fr)) }
}
@media (max-width: 600px){
  .grid.cols-2, .grid.cols-3, .grid.cols-4{ grid-template-columns: 1fr }
}

/* nft card */
.nft-card{
  background: var(--white);
  padding: 16px;
  cursor:pointer;
  position: relative;
  transition: transform .1s steps(2);
}
.nft-card:hover{ transform: translate(-2px,-2px) }
.nft-thumb{
  background: var(--paper-2);
  aspect-ratio: 1/1;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  overflow:hidden;
}
.nft-thumb.dither-bg{ background-color: var(--paper-2) }

/* legal page typography */
.legal{
  background: var(--white);
  padding: 40px 44px;
  max-width: 820px; margin: 0 auto;
  font-size: 18px;
  line-height: 1.6;
}
.legal h1{ font-family:'PressStart', monospace; font-size: 22px; margin-bottom: 8px }
.legal h2{ font-family:'PressStart', monospace; font-size: 12px; margin: 28px 0 8px; color: var(--coral) }
.legal h3{ font-family:'PressStart', monospace; font-size: 10px; margin: 18px 0 6px }
.legal p{ margin-bottom: 12px }
.legal ul{ padding-left: 22px; margin-bottom: 12px }
.legal li{ margin-bottom: 4px }
.legal .meta{ font-family:'PressStart', monospace; font-size: 9px; color:#888 }

/* avatar stage */
.stage{
  background:
    radial-gradient(ellipse at 50% 70%, rgba(255,184,200,.6) 0%, transparent 50%),
    linear-gradient(to bottom, var(--sky) 0%, var(--pink-neon) 60%, var(--lemon) 100%);
  position:relative;
  overflow:hidden;
  min-height: 540px;
  display:flex; align-items:flex-end; justify-content:center;
}
.stage .star{
  position:absolute; width:8px; height:8px;
  background: var(--white);
  clip-path: polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
}

/* split view */
.split{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  background: var(--white);
}
@media (max-width: 800px){
  .split{ grid-template-columns: 1fr }
}

/* stat row */
.stat-row{
  display:flex; justify-content:space-between; align-items:center;
  padding: 10px 0;
  border-bottom: 2px dotted var(--ink);
}
.stat-row:last-child{ border-bottom: none }
.stat-key{
  font-family:'PressStart', monospace;
  font-size: 10px; letter-spacing:.04em;
}
.stat-val{ font-size: 20px }

/* gridfloor */
.gridfloor{
  position:absolute; left:0; right:0; bottom:0; height: 60%;
  background:
    linear-gradient(to top, var(--coral) 0%, transparent 100%),
    repeating-linear-gradient(0deg, transparent 0 24px, rgba(255,255,255,.4) 24px 26px),
    repeating-linear-gradient(90deg, transparent 0 24px, rgba(255,255,255,.4) 24px 26px);
  transform: perspective(400px) rotateX(60deg);
  transform-origin: top;
  opacity:.5;
}

/* badge ribbons */
.ribbon{
  position:absolute; top:-6px; right:-6px;
  background: var(--coral);
  color: var(--white);
  padding: 6px 8px;
  font-family:'PressStart', monospace; font-size:9px;
  z-index: 2;
  box-shadow: 0 0 0 3px var(--ink);
}
.ribbon.gold{ background: #F4C53C; color: var(--ink) }
.ribbon.purple{ background: var(--lavender); color: var(--ink) }
.ribbon.mint{ background: var(--mint); color: var(--ink) }

/* clickable rows */
.row-list{
  display:flex; flex-direction:column; gap:12px;
}
.row-list .row{
  display:grid; grid-template-columns: 60px 1fr auto; gap:14px; align-items:center;
  background: var(--white); padding: 12px;
  cursor:pointer;
}
.row-list .row:hover{ background: var(--paper-2) }
.row-list .row.active{ background: var(--ink); color: var(--white) }
.row-list .row.active .stat-key{ color: var(--coral-soft) }

/* tooltip */
.kbd{
  font-family:'PressStart', monospace; font-size:9px;
  border:2px solid var(--ink);
  padding: 3px 6px;
  background: var(--white);
  display:inline-block;
}

/* override PressStart class to use Google's font reliably */
.pixel, .pxl-btn, .chip, .opt, .nav .link, .nav .logo span,
.legal h1, .legal h2, .legal h3, .stat-key, .ribbon, .kbd, .foot {
  font-family: 'Press Start 2P', 'VT323', monospace !important;
}
</style>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
  }, [open, clampToViewport]);
  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd"><b>{title}</b><button className="twk-x" onClick={dismiss}>✕</button></div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return <><div className="twk-sect">{label}</div>{children}</>;
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} role="switch" aria-checked={!!value} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value} onChange={e => onChange(e.target.value)} />
    </div>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSlider, TweakToggle, TweakColor });

<script type="text/babel">
const PixelizerUtils = {
  quantize(imageData, numColors) {
    const pixels = [];
    for (let i = 0; i < imageData.data.length; i += 4) {
      if (imageData.data[i+3] > 128) pixels.push([imageData.data[i], imageData.data[i+1], imageData.data[i+2]]);
    }
    if (pixels.length === 0) return [];
    let palette = [];
    const step = Math.max(1, Math.floor(pixels.length / numColors));
    for (let i = 0; i < numColors && i*step < pixels.length; i++) palette.push(pixels[i*step]);
    for (let iter = 0; iter < 5; iter++) {
      const clusters = palette.map(() => ({ sum:[0,0,0], count:0 }));
      for (const p of pixels) {
        let best = 0, bestD = Infinity;
        for (let j = 0; j < palette.length; j++) { const d = this.colorDist(p, palette[j]); if (d < bestD) { bestD = d; best = j; } }
        clusters[best].sum[0] += p[0]; clusters[best].sum[1] += p[1]; clusters[best].sum[2] += p[2]; clusters[best].count++;
      }
      palette = clusters.map((c,i) => c.count > 0 ? [c.sum[0]/c.count, c.sum[1]/c.count, c.sum[2]/c.count] : palette[i]);
    }
    return palette.map(c => c.map(Math.round));
  },
  colorDist(a,b) { return (a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2; },
  closestColor(r,g,b,palette) { let best=0,bestD=Infinity; for(let i=0;i<palette.length;i++){const d=this.colorDist([r,g,b],palette[i]);if(d<bestD){bestD=d;best=i;}} return palette[best]; },
  rgbToHex(r,g,b) { return '#'+[r,g,b].map(x=>{const h=Math.round(x).toString(16);return h.length===1?'0'+h:h;}).join(''); },
  async pixelateImage(imgElement, blockSize, numColors) {
    const canvas = document.createElement('canvas');
    const maxW = 600; let w = imgElement.width, h = imgElement.height;
    if (w > maxW) { h = Math.round(h*maxW/w); w = maxW; }
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d'); ctx.drawImage(imgElement, 0, 0, w, h);
    const pixW = Math.ceil(w/blockSize), pixH = Math.ceil(h/blockSize);
    const tmpCanvas = document.createElement('canvas'); tmpCanvas.width = pixW; tmpCanvas.height = pixH;
    const tmpCtx = tmpCanvas.getContext('2d'); tmpCtx.drawImage(canvas, 0, 0, pixW, pixH);
    const imgData = tmpCtx.getImageData(0, 0, pixW, pixH);
    const palette = this.quantize(imgData, numColors);
    const pixelGrid = [];
    for (let y = 0; y < pixH; y++) {
      const row = [];
      for (let x = 0; x < pixW; x++) {
        const idx = (y*pixW+x)*4; const alpha = imgData.data[idx+3];
        if (alpha < 128) { row.push({ transparent:true }); }
        else { const [r,g,b] = this.closestColor(imgData.data[idx], imgData.data[idx+1], imgData.data[idx+2], palette); row.push({ r,g,b, hex:this.rgbToHex(r,g,b) }); }
      }
      pixelGrid.push(row);
    }
    return { grid:pixelGrid, palette:palette.map(c=>this.rgbToHex(c[0],c[1],c[2])), width:pixW, height:pixH };
  },
};

const PixelizedAvatar = ({ pixelData, colorMap = {}, scale = 4, style = {} }) => {
  if (!pixelData) return null;
  const { grid, width, height } = pixelData;
  const shadows = [];
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const pixel = grid[y][x];
      if (pixel.transparent) continue;
      shadows.push(`${x*scale}px ${y*scale}px 0 ${colorMap[pixel.hex] || pixel.hex}`);
    }
  }
  return (
    <div style={{ position:'relative', width:width*scale, height:height*scale, ...style }}>
      <div style={{ width:scale, height:scale, boxShadow:shadows.length>0?shadows.join(','):'none', background:'transparent' }} />
    </div>
  );
};

const ImagePixelizerTool = ({ onPixelDataReady }) => {
  const [isDragging, setIsDragging] = React.useState(false);
  const [isProcessing, setIsProcessing] = React.useState(false);
  const [pixelSize, setPixelSize] = React.useState(4);
  const [colorCount, setColorCount] = React.useState(32);
  const fileInputRef = React.useRef(null);
  const handleFile = async (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    setIsProcessing(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const img = new Image();
      img.onload = async () => { const data = await PixelizerUtils.pixelateImage(img, pixelSize, colorCount); onPixelDataReady(data); setIsProcessing(false); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };
  return (
    <div>
      <div className={`pxl-box ${isDragging?'scanlines':''}`}
        onDragOver={e=>{e.preventDefault();setIsDragging(true);}} onDragLeave={()=>setIsDragging(false)}
        onDrop={e=>{e.preventDefault();setIsDragging(false);handleFile(e.dataTransfer.files[0]);}}
        onClick={()=>fileInputRef.current?.click()}
        style={{ padding:'2rem', textAlign:'center', cursor:'pointer', background:isDragging?'var(--coral-soft)':'#fff', minHeight:120, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:8 }}>
        <input ref={fileInputRef} type="file" accept="image/*" onChange={e=>handleFile(e.target.files[0])} style={{display:'none'}} />
        {isProcessing ? <div className="mono" style={{fontSize:16}}>Processing...</div> : <>
          <div className="pixel" style={{fontSize:12}}>{isDragging?'DROP IMAGE HERE':'UPLOAD AVATAR IMAGE'}</div>
          <div className="mono" style={{fontSize:14,opacity:.6}}>Drop image or click to browse</div>
        </>}
      </div>
      <div style={{ marginTop:16, display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
        <div className="pxl-box" style={{padding:12}}>
          <div className="pixel" style={{fontSize:9,marginBottom:8}}>PIXEL SIZE: <span style={{color:'var(--coral)'}}>{pixelSize}px</span></div>
          <input type="range" min="2" max="16" value={pixelSize} onChange={e=>setPixelSize(parseInt(e.target.value))} style={{width:'100%'}} />
        </div>
        <div className="pxl-box" style={{padding:12}}>
          <div className="pixel" style={{fontSize:9,marginBottom:8}}>COLORS: <span style={{color:'var(--coral)'}}>{colorCount}</span></div>
          <input type="range" min="8" max="64" value={colorCount} onChange={e=>setColorCount(parseInt(e.target.value))} style={{width:'100%'}} />
        </div>
      </div>
    </div>
  );
};

Object.assign(window, { PixelizerUtils, PixelizedAvatar, ImagePixelizerTool });
</script>

    <div className="nft-card pxl-box" onClick={onClick}>

      <div className="nft-thumb dither-bg" style={{ marginBottom:12 }}>

<script type="text/babel">
const AvatarPage = ({ initialEquip }) => {
  const [skin, setSkin] = useState('light');
  const [eye, setEye] = useState('brown');
  const [equipped, setEquipped] = useState(initialEquip || { head:'starCrown', outfit:'cropPink', item:'starWand', boots:null });
  const [activeSlot, setActiveSlot] = useState('head');
  const [bg, setBg] = useState('cloud');
  const [uploadedPixelData, setUploadedPixelData] = useState(null);
  const [skinColorMap, setSkinColorMap] = useState({});
  const [eyeColorMap, setEyeColorMap] = useState({});
  const [showUploader, setShowUploader] = useState(false);

  const ownedNFTs = NFT_LIBRARY.filter(n => n.owned);
  const slotItems = ownedNFTs.filter(n => n.slot === activeSlot);
  const bootsItems = [
    { id:'BOOTS-001', name:'Stardust Boots', art:'starAura', slot:'boots', rarity:'Epic', serial:'#0007 / 50' },
    { id:'BOOTS-002', name:'Ember Greaves',  art:'emberAura', slot:'boots', rarity:'Legendary', serial:'#0001 / 10' },
  ];

  const totalPoints =
    (equipped.head   ? (NFT_LIBRARY.find(n => n.art === equipped.head)?.pointsBonus   || 0) : 0) +
    (equipped.outfit ? (NFT_LIBRARY.find(n => n.art === equipped.outfit)?.pointsBonus || 0) : 0) +
    (equipped.item   ? (NFT_LIBRARY.find(n => n.art === equipped.item)?.pointsBonus   || 0) : 0);

  const equip = (artId) => setEquipped(e => ({ ...e, [activeSlot]: e[activeSlot] === artId ? null : artId }));

  const stageStyle = {
    cloud: { background:'linear-gradient(to bottom, #A8DEFF 0%, #FFB8C8 60%, #FFE9A8 100%)' },
    night: { background:'linear-gradient(to bottom, #1A1330 0%, #4A2C5E 60%, #8E5CF7 100%)' },
    dojo:  { background:'linear-gradient(to bottom, #F8E9E5 0%, #DCC7C7 100%)' },
    void:  { background:'radial-gradient(ellipse at center, #4A3838 0%, #2A1B1B 100%)' },
  }[bg];

  const SlotCell = ({ slot, active, equippedArt, onClick }) => (
    <div onClick={onClick} className="pxl-box no-drop"
      style={{ background:active?'var(--coral)':'#fff', cursor:'pointer', padding:10, textAlign:'center',
        boxShadow: active ? '0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 8px 0 0 var(--coral-deep)' : '0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink)' }}>
      <div className="pixel" style={{ fontSize:8, marginBottom:6, color:active?'#fff':'var(--ink)' }}>{slot.toUpperCase()}</div>
      <div style={{ background:active?'#fff':'var(--paper-2)', height:56, display:'flex', alignItems:'center', justifyContent:'center' }}>
        {equippedArt ? <ClothingArt id={equippedArt} scale={2} /> : <span className="mono" style={{ fontSize:14, opacity:.4 }}>empty</span>}
      </div>
    </div>
  );

  return (
    <div className="page">
      <div style={{ display:'flex', alignItems:'baseline', gap:12, marginBottom:18, flexWrap:'wrap' }}>
        <h1 className="pixel" style={{ fontSize:26 }}>MY AVATAR</h1>
        <span className="mono" style={{ fontSize:20, opacity:.6 }}>// dress your chibi. earn your points.</span>
        <span style={{ marginLeft:'auto', display:'flex', gap:6, alignItems:'center' }}>
          <span className="chip">VTO POINTS</span>
          <span className="pixel" style={{ fontSize:18, color:'var(--coral)' }}>{totalPoints.toLocaleString()}</span>
        </span>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1.2fr 1fr', gap:24 }}>
        <div className="pxl-box scanlines" style={{ ...stageStyle, position:'relative', minHeight:600, overflow:'hidden' }}>
          <PixelStar size={4} color="#FFFFFF" style={{ top:30, left:40 }} />
          <PixelStar size={3} color="#FFE9A8" style={{ top:70, left:'70%' }} />
          <PixelStar size={5} color="#FFFFFF" style={{ top:120, left:'40%' }} />
          <SparkleDot color="#FFFFFF" size={3} style={{ top:60, left:'85%' }} />
          <SparkleDot color="#FFE9A8" size={4} style={{ top:200, left:90 }} />
          <div className="gridfloor" />
          <div style={{ position:'absolute', left:'50%', top:'50%', transform:'translate(-50%, -50%)' }}>
            <div className="float">
              {uploadedPixelData
                ? <PixelizedAvatar pixelData={uploadedPixelData} colorMap={{ ...skinColorMap, ...eyeColorMap }} scale={8} />
                : <ChibiAvatar skin={skin} eye={eye} scale={8} equipped={equipped} />}
            </div>
          </div>
          <div style={{ position:'absolute', bottom:20, left:20, right:20, display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
            <div className="pxl-box dark" style={{ padding:'10px 14px' }}>
              <div className="pixel" style={{ fontSize:12, color:'var(--coral-soft)' }}>WANDERER · LV 14</div>
              <div className="mono" style={{ fontSize:18 }}>WardrobeForge.eth</div>
            </div>
            <div className="pxl-box dark" style={{ padding:'10px 14px', minWidth:220 }}>
              <div className="pixel" style={{ fontSize:9, marginBottom:6, color:'var(--pink-neon)' }}>WARDROBE XP</div>
              <div className="bar"><i style={{ width:'72%' }} /></div>
              <div className="mono" style={{ fontSize:14, marginTop:4 }}>1,420 / 2,000 XP</div>
            </div>
          </div>
          <div style={{ position:'absolute', top:14, right:14, display:'flex', gap:6 }}>
            {['cloud','night','dojo','void'].map(b => (
              <button key={b} className={`opt ${bg===b?'active':''}`} onClick={() => setBg(b)}>{b}</button>
            ))}
          </div>
          <div style={{ position:'absolute', top:14, left:14, display:'flex', flexDirection:'column', gap:8 }}>
            {!uploadedPixelData && <>
              <div className="pxl-box no-drop" style={{ background:'rgba(255,255,255,.92)', padding:8 }}>
                <div className="pixel" style={{ fontSize:8, marginBottom:6 }}>SKIN</div>
                <div style={{ display:'flex', gap:4 }}>
                  {Object.keys(SKIN_TONES).map(s => (
                    <button key={s} onClick={() => setSkin(s)} title={s}
                      style={{ width:22, height:22, border:skin===s?'3px solid var(--ink)':'3px solid transparent', background:SKIN_TONES[s].mid, cursor:'pointer', boxShadow:'0 0 0 2px var(--ink)', padding:0 }} />
                  ))}
                </div>
              </div>
              <div className="pxl-box no-drop" style={{ background:'rgba(255,255,255,.92)', padding:8 }}>
                <div className="pixel" style={{ fontSize:8, marginBottom:6 }}>EYES</div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(6, 22px)', gap:4 }}>
                  {Object.keys(EYE_COLORS).map(k => (
                    <button key={k} onClick={() => setEye(k)} title={k}
                      style={{ width:22, height:22, border:eye===k?'3px solid var(--ink)':'3px solid transparent', background:EYE_COLORS[k], cursor:'pointer', boxShadow:'0 0 0 2px var(--ink)', padding:0 }} />
                  ))}
                </div>
              </div>
            </>}
            <button className="pxl-btn" style={{ fontSize:8, padding:'6px 10px' }} onClick={() => setShowUploader(!showUploader)}>
              {uploadedPixelData ? 'CHANGE IMAGE' : 'UPLOAD IMAGE'}
            </button>
            {uploadedPixelData && <button className="pxl-btn ghost" style={{ fontSize:8, padding:'6px 10px' }} onClick={() => { setUploadedPixelData(null); setSkinColorMap({}); setEyeColorMap({}); }}>USE CHIBI</button>}
          </div>
        </div>

        <div className="pxl-box" style={{ background:'#fff', padding:22 }}>
          <div className="pixel" style={{ fontSize:14, marginBottom:14 }}>LOADOUT</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:8, marginBottom:18 }}>
            {['head','outfit','item','boots'].map(slot => (
              <SlotCell key={slot} slot={slot} active={activeSlot===slot} equippedArt={equipped[slot]} onClick={() => setActiveSlot(slot)} />
            ))}
          </div>
          <hr className="pxl-hr" />
          <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:12 }}>
            <div className="pixel" style={{ fontSize:12 }}>INVENTORY</div>
            <div className="mono" style={{ fontSize:16, opacity:.6 }}>// {activeSlot.toUpperCase()} SLOT</div>
          </div>
          <div className="avatar-inventory-grid" style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:10, maxHeight:292, overflowY:'auto', paddingTop:4, paddingLeft:4, paddingRight:10, paddingBottom:4 }}>
            {(activeSlot==='boots' ? bootsItems : slotItems).map(item => {
              const isEquipped = equipped[activeSlot] === item.art;
              return (
                <div key={item.id} className="pxl-box no-drop" onClick={() => equip(item.art)}
                  style={{ background:isEquipped?'var(--ink)':'#fff', color:isEquipped?'#fff':'var(--ink)', padding:8, cursor:'pointer', position:'relative' }}>
                  {isEquipped && <span className="chip coral" style={{ position:'absolute', top:4, right:4, fontSize:8 }}>ON</span>}
                  <div style={{ background:isEquipped?'#3D2828':'var(--paper-2)', height:80, display:'flex', alignItems:'center', justifyContent:'center', marginBottom:6 }}>
                    <ClothingArt id={item.art} scale={2.5} />
                  </div>
                  <div className="pixel" style={{ fontSize:8, lineHeight:1.3 }}>{item.name}</div>
                  <div className="mono" style={{ fontSize:13, opacity:.7 }}>{item.serial}</div>
                </div>
              );
            })}
            {(activeSlot==='boots' ? bootsItems : slotItems).length === 0 && (
              <div style={{ gridColumn:'1 / -1', padding:24, textAlign:'center', color:'var(--ink)', opacity:.5 }} className="mono">Nothing here yet. Buy a piece to mint a twin.</div>
            )}
          </div>
          <hr className="pxl-hr" />
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <button className="pxl-btn ghost" style={{ flex:1 }} onClick={() => setEquipped({ head:null, outfit:null, item:null, boots:null })}>UNEQUIP ALL</button>
            <button className="pxl-btn" style={{ flex:1 }}>SAVE LOOK</button>
          </div>
        </div>
      </div>

      {showUploader && (
        <div style={{ position:'fixed', top:0, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.7)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
          <div className="pxl-box" style={{ background:'#fff', padding:24, maxWidth:600, width:'100%' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
              <h2 className="pixel" style={{ fontSize:16 }}>PIXELIZE YOUR AVATAR</h2>
              <button className="pxl-btn ghost" onClick={() => setShowUploader(false)}>CLOSE</button>
            </div>
            <ImagePixelizerTool onPixelDataReady={data => { setUploadedPixelData(data); setSkinColorMap({}); setEyeColorMap({}); setShowUploader(false); }} />
          </div>
        </div>
      )}

      <div style={{ marginTop:24 }} className="pxl-box no-drop">
        <div style={{ background:'var(--ink)', color:'#fff', padding:'10px 16px' }}>
          <div className="pixel" style={{ fontSize:11, color:'var(--pink-neon)' }}>CURRENTLY EQUIPPED</div>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:1, background:'var(--ink)' }}>
          {['head','outfit','item','boots'].map(slot => {
            const art = equipped[slot];
            const nft = art ? NFT_LIBRARY.find(n => n.art===art) || bootsItems.find(a => a.art===art) : null;
            return (
              <div key={slot} style={{ background:'#fff', padding:14 }}>
                <div className="pixel" style={{ fontSize:9, opacity:.6, marginBottom:6 }}>{slot.toUpperCase()}</div>
                {nft ? <>
                  <div className="pixel" style={{ fontSize:12, marginBottom:4 }}>{nft.name}</div>
                  <div className="mono" style={{ fontSize:16, opacity:.7 }}>{nft.serial || '?'}</div>
                </> : <div className="mono" style={{ fontSize:16, opacity:.4 }}>— empty —</div>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

window.AvatarPage = AvatarPage;
</script>

<script type="text/babel">
const NFTsPage = ({ initialId }) => {
  const [selectedId, setSelectedId] = useState(initialId || NFT_LIBRARY[0].id);
  const [filter, setFilter] = useState('All');
  const [rarity, setRarity] = useState('All');
  const selected = NFT_LIBRARY.find(n => n.id === selectedId);
  const filtered = NFT_LIBRARY.filter(n => {
    if (filter !== 'All' && n.slot !== filter.toLowerCase()) return false;
    if (rarity !== 'All' && n.rarity !== rarity) return false;
    return true;
  });

  const FilterGroup = ({ label, value, onChange, options }) => (
    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
      <span className="pixel" style={{ fontSize:10, opacity:.6 }}>{label}</span>
      <div className="opts">
        {options.map(o => <button key={o} className={`opt ${value===o?'active':''}`} onClick={() => onChange(o)}>{o}</button>)}
      </div>
    </div>
  );

  const Legend = ({ title, items }) => (
    <div>
      <div className="pixel" style={{ fontSize:10, color:'var(--coral)', marginBottom:8 }}>{title}</div>
      <ul style={{ listStyle:'none', display:'flex', flexDirection:'column', gap:4 }}>
        {items.map(i => <li key={i} style={{ fontSize:18, display:'flex', gap:6 }}><span style={{ color:'var(--coral)' }}>▸</span> {i}</li>)}
      </ul>
    </div>
  );

  return (
    <div className="page">
      <div style={{ display:'flex', alignItems:'baseline', gap:12, marginBottom:18, flexWrap:'wrap' }}>
        <h1 className="pixel" style={{ fontSize:26 }}>CLOTHING NFTS</h1>
        <span className="mono" style={{ fontSize:20, opacity:.6 }}>// the relics you might roll</span>
      </div>
      <div className="pxl-box" style={{ background:'#fff', padding:16, marginBottom:24 }}>
        <div style={{ display:'flex', gap:18, flexWrap:'wrap', alignItems:'center' }}>
          <FilterGroup label="SLOT" value={filter} onChange={setFilter} options={['All','Head','Outfit','Item','Boots']} />
          <FilterGroup label="RARITY" value={rarity} onChange={setRarity} options={['All','Common','Rare','Epic','Legendary']} />
          <span style={{ marginLeft:'auto' }} className="mono">{filtered.length} relics</span>
        </div>
      </div>
      <div className="pxl-box no-drop" style={{ background:'#fff' }}>
        <div className="split">

<script type="text/babel">
const { useState: useStateApp, useEffect: useEffectApp } = React;

const App = () => {
  const [page, setPage] = useStateApp(() => window.location.hash.replace('#','') || 'main');
  const [nftFocus, setNftFocus] = useStateApp(null);
  const [tweaks, setTweak] = useTweaks({ accent:'#F85646', scanlines:true, skin:'lavender', fontScale:1 });

  useEffectApp(() => {
    document.documentElement.style.setProperty('--coral', tweaks.accent);
    document.documentElement.style.fontSize = (16 * tweaks.fontScale) + 'px';
  }, [tweaks.accent, tweaks.fontScale]);

  const goto = (p, focus) => {
    setPage(p);
    if (focus) setNftFocus(focus);
    window.location.hash = p;
    window.scrollTo(0, 0);
  };

  useEffectApp(() => {
    const onHash = () => setPage(window.location.hash.replace('#','') || 'main');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <nav className="nav">
        <div className="logo" onClick={() => goto('main')}>
          <img src="assets/logo.png?v=2" alt="WardrobeForge" onError={e => e.target.style.display='none'} />
          <span>WARDROBE<span style={{ color:'var(--coral)' }}>FORGE</span></span>
        </div>
        <div className="links">
          <div className={`link ${page==='main'?'active':''}`} onClick={() => goto('main')}>HOME</div>
          <div className={`link ${page==='avatar'?'active':''}`} onClick={() => goto('avatar')}>MY AVATAR</div>
          <div className={`link ${page==='nfts'?'active':''}`} onClick={() => goto('nfts')}>CLOTHING NFTS</div>
          <div className={`link ${page==='privacy'?'active':''}`} onClick={() => goto('privacy')}>PRIVACY</div>
          <div className={`link ${page==='terms'?'active':''}`} onClick={() => goto('terms')}>TERMS</div>
          <button className="pxl-btn" style={{ marginLeft:8 }} onClick={() => goto('avatar')}>CONNECT</button>
        </div>
      </nav>

      <main style={{ flex:1 }}>
        {page === 'main'    && <MainPage goto={goto} />}
        {page === 'avatar'  && <AvatarPage />}
        {page === 'nfts'    && <NFTsPage initialId={nftFocus} />}
        {page === 'privacy' && <PrivacyPage />}
        {page === 'terms'   && <TermsPage />}
      </main>

      <footer className="foot">
        <div style={{ marginBottom:14 }}>2026 WardrobeForge · All rights reserved · Forge Your Wardrobe</div>
        <div>
          <a onClick={() => goto('main')} style={{ cursor:'pointer' }}>HOME</a> ·
          <a onClick={() => goto('avatar')} style={{ cursor:'pointer' }}>AVATAR</a> ·
          <a onClick={() => goto('nfts')} style={{ cursor:'pointer' }}>NFTS</a> ·
          <a onClick={() => goto('topup')} style={{ cursor:'pointer' }}>TOP UP</a> ·
          <a onClick={() => goto('account')} style={{ cursor:'pointer' }}>SIGN IN</a> ·
          <a onClick={() => goto('privacy')} style={{ cursor:'pointer' }}>PRIVACY</a> ·
          <a onClick={() => goto('terms')} style={{ cursor:'pointer' }}>TERMS</a>
        </div>
      </footer>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Look & Feel">
          <TweakColor label="Accent color" value={tweaks.accent} onChange={v => setTweak('accent', v)} />
          <TweakToggle label="Font scale" value={tweaks.scanlines} onChange={v => setTweak('scanlines', v)} />
          <TweakSlider label="Font scale" min={0.85} max={1.2} step={0.05} value={tweaks.fontScale} onChange={v => setTweak('fontScale', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
