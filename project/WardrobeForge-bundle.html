};

const ImagePixelizerTool = ({ onPixelDataReady }) => {
  const [isDragging, setIsDragging] = React.useState(false);
  const [isProcessing, setIsProcessing] = React.useState(false);
  const [pixelSize, setPixelSize] = React.useState(4);
  const [colorCount, setColorCount] = React.useState(32);
  const [sourceUrl, setSourceUrl] = React.useState('');
  const [pixelData, setPixelData] = React.useState(null);
  const [error, setError] = React.useState('');
  const fileInputRef = React.useRef(null);
  const originalCanvasRef = React.useRef(null);
  const pixelCanvasRef = React.useRef(null);

  const renderFromSource = React.useCallback((nextSourceUrl) => {
    if (!nextSourceUrl) return;

    setIsProcessing(true);
    setError('');

    const img = new Image();
    img.onload = async () => {
      const maxW = 600;
      let w = img.width;
      let h = img.height;
      if (w > maxW) {
        h = Math.round((h * maxW) / w);
        w = maxW;
      }

      const originalCanvas = originalCanvasRef.current;
      if (originalCanvas) {
        originalCanvas.width = w;
        originalCanvas.height = h;
        const ctx = originalCanvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
      }

      const nextPixelData = await PixelizerUtils.pixelateImage(img, pixelSize, colorCount);
      setPixelData(nextPixelData);
      PixelizerUtils.drawPixelDataToCanvas(pixelCanvasRef.current, nextPixelData, pixelSize);
      setIsProcessing(false);
    };
    img.onerror = () => {
      setError('Could not read that image.');
      setIsProcessing(false);
    };
    img.src = nextSourceUrl;
  }, [pixelSize, colorCount]);

  React.useEffect(() => {
    if (sourceUrl) renderFromSource(sourceUrl);
  }, [sourceUrl, renderFromSource]);

  const handleFile = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      setSourceUrl(event.target.result);
    };
    reader.readAsDataURL(file);
  };

  const handleDownload = () => {
    if (!pixelCanvasRef.current) return;
    const link = document.createElement('a');
    link.href = pixelCanvasRef.current.toDataURL('image/png');
    link.download = 'pixelized-avatar.png';
    link.click();
  };

  return (
    <div>
      <div
        onDragOver={(event) => {
          event.preventDefault();
          setIsDragging(true);
        }}
        onDragLeave={() => setIsDragging(false)}
        onDrop={(event) => {
          event.preventDefault();
          setIsDragging(false);
          handleFile(event.dataTransfer.files[0]);
        }}
        onClick={() => fileInputRef.current?.click()}
        style={{
          border: '2px dashed ' + (isDragging ? 'var(--coral)' : '#aaa'),
          borderRadius: 12,
          padding: '2.5rem 1rem',
          textAlign: 'center',
          cursor: 'pointer',
          background: isDragging ? '#fff0ec' : '#f9f9f9',
        }}
      >
        <input
          ref={fileInputRef}
          type="file"
          accept="image/*"
          style={{ display: 'none' }}
          onChange={(event) => handleFile(event.target.files[0])}
        />
        <p className="pixel" style={{ fontSize: 12, marginBottom: 8 }}>
          {isDragging ? 'DROP IMAGE HERE' : 'DROP IMAGE OR CLICK TO BROWSE'}
        </p>
        <p className="mono" style={{ fontSize: 14, opacity: 0.65 }}>
          PNG, JPG, GIF, WebP
        </p>
      </div>

      {!!sourceUrl && (
        <>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, margin: '1rem 0' }}>
            <div className="pxl-box" style={{ padding: 12 }}>
              <div className="pixel" style={{ fontSize: 9, marginBottom: 8 }}>
                PIXEL SIZE: <span style={{ color: 'var(--coral)' }}>{pixelSize}px</span>
              </div>
              <input
                type="range"
                min="2"
                max="32"
                step="1"
                value={pixelSize}
                onChange={(event) => setPixelSize(parseInt(event.target.value, 10))}
                style={{ width: '100%' }}
              />
            </div>

            <div className="pxl-box" style={{ padding: 12 }}>
              <div className="pixel" style={{ fontSize: 9, marginBottom: 8 }}>
                COLORS: <span style={{ color: 'var(--coral)' }}>{colorCount}</span>
              </div>
              <input
                type="range"
                min="2"
                max="256"
                step="1"
                value={colorCount}
                onChange={(event) => setColorCount(parseInt(event.target.value, 10))}
                style={{ width: '100%' }}
              />
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginTop: '1rem' }}>
            <div className="pxl-box no-drop" style={{ padding: 8, background: '#f5f5f5' }}>
              <div className="mono" style={{ fontSize: 12, color: '#777', marginBottom: 6, textAlign: 'center' }}>
                Original
              </div>
              <canvas ref={originalCanvasRef} style={{ maxWidth: '100%', borderRadius: 4, imageRendering: 'pixelated' }} />
            </div>

            <div className="pxl-box no-drop" style={{ padding: 8, background: '#f5f5f5' }}>
              <div className="mono" style={{ fontSize: 12, color: '#777', marginBottom: 6, textAlign: 'center' }}>
                Pixelized
              </div>
              <canvas ref={pixelCanvasRef} style={{ maxWidth: '100%', borderRadius: 4, imageRendering: 'pixelated' }} />
            </div>
          </div>
        </>
      )}

      {pixelData && !isProcessing && (
        <div className="pxl-box no-drop" style={{ marginTop: 16, padding: 12, background: 'rgba(255,255,255,.9)' }}>
          <div className="pixel" style={{ fontSize: 8, marginBottom: 8 }}>SUGGESTED EDITABLE COLORS</div>
          <div className="mono" style={{ fontSize: 13, opacity: 0.7, marginBottom: 8 }}>
            Skin: {pixelData.suggestedRegions.skin.length ? pixelData.suggestedRegions.skin.join(', ') : 'none detected'}
          </div>
          <div className="mono" style={{ fontSize: 13, opacity: 0.7 }}>
            Eyes: {pixelData.suggestedRegions.eyes.length ? pixelData.suggestedRegions.eyes.join(', ') : 'none detected'}
          </div>
        </div>
      )}

      {error && (
        <div className="mono" style={{ marginTop: 12, color: 'var(--coral-deep)' }}>
          {error}
        </div>
      )}

      <div style={{ display: 'flex', gap: 8, marginTop: 16 }}>
        <button
          className="pxl-btn ghost"
          style={{ flex: 1 }}
          onClick={handleDownload}
          disabled={!pixelData || isProcessing}
        >
          DOWNLOAD PNG
        </button>
        <button
          className="pxl-btn"
          style={{ flex: 1 }}
          onClick={() => pixelData && onPixelDataReady(pixelData)}
          disabled={!pixelData || isProcessing}
        >
          USE THIS AVATAR
        </button>
      </div>
    </div>
  );
};

window.PixelizerUtils = PixelizerUtils;
window.PixelizedAvatar = PixelizedAvatar;
window.ImagePixelizerTool = ImagePixelizerTool;
window.buildUploadedAvatarColorMap = buildUploadedAvatarColorMap;
window.saveAvatarState = saveAvatarState;
window.loadAvatarState = loadAvatarState;

</script>

const AnimatedStat = ({ target, k, prefix = '', suffix = '', duration = 1400 }) => {
  const [value, setValue] = useState(0);

  useEffect(() => {
    let frameId = 0;
    const startTime = performance.now();

    const tick = (now) => {
      const progress = Math.min((now - startTime) / duration, 1);
      const easedProgress = 1 - Math.pow(1 - progress, 3);
      setValue(Math.round(target * easedProgress));

      if (progress < 1) {
        frameId = window.requestAnimationFrame(tick);
      }
    };

    frameId = window.requestAnimationFrame(tick);
    return () => window.cancelAnimationFrame(frameId);
  }, [duration, target]);

  return (
    <div>
      <div className="pixel" style={{ fontSize: 22, color: 'var(--coral)' }}>
        {prefix}{value.toLocaleString('en-US')}{suffix}
      </div>
      <div className="pixel" style={{ fontSize: 9, opacity: .7, marginTop: 4 }}>{k}</div>
    </div>
  );
};

const getAvatarScopedStorageKey = (baseKey, userId = null) => (
  window.WardrobeForgeAuth?.getScopedStorageKey?.(baseKey, userId) || baseKey
);

const readEquippedLoadout = (storageKey, fallback, getValidArt) => {
  try {
    const raw = window.localStorage.getItem(storageKey);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return {
      head: getValidArt(parsed.head, fallback.head),
      outfit: getValidArt(parsed.outfit, fallback.outfit),
      item: getValidArt(parsed.item, fallback.item),
      boots: getValidArt(parsed.boots, fallback.boots),
    };
  } catch (error) {
    return fallback;
  }
};

const readSavedLooks = (storageKey) => {
  try {
    const raw = window.localStorage.getItem(storageKey);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed.filter((entry) => entry && typeof entry.imageSrc === 'string') : [];
  } catch (error) {
    return [];
  }
};

const persistSavedLooks = (storageKey, looks) => {
  if (!Array.isArray(looks)) return;

  for (let count = looks.length; count >= 0; count -= 1) {
    try {
      window.localStorage.setItem(
        storageKey,
        JSON.stringify(looks.slice(0, count)),
      );
      return looks.slice(0, count);
    } catch (error) {
      if (count === 0) {
        try {
          window.localStorage.removeItem(storageKey);
        } catch (removeError) {
          // Ignore storage cleanup failures and keep the page interactive.
        }
        return [];
      }
    }
  }

  return [];
};

const createSavedLookImage = (sourceCanvas) => {
  const targetWidth = 160;
  const scale = targetWidth / sourceCanvas.width;
  const targetHeight = Math.max(1, Math.round(sourceCanvas.height * scale));
  const previewCanvas = document.createElement('canvas');
  previewCanvas.width = targetWidth;
  previewCanvas.height = targetHeight;

  const previewCtx = previewCanvas.getContext('2d');
  previewCtx.imageSmoothingEnabled = false;
  previewCtx.drawImage(sourceCanvas, 0, 0, targetWidth, targetHeight);

  return previewCanvas.toDataURL('image/png');
};

  return ({

    Rare: 45,

};

const drawBottomAlignedImage = (ctx, image, alignBottomY) => {
  const sourceWidth = image.naturalWidth || image.width;
  const sourceHeight = image.naturalHeight || image.height;
  const scale = AVATAR_SOURCE_WIDTH / sourceWidth;
  const destWidth = sourceWidth * scale;
  const destHeight = sourceHeight * scale;
  const destY = alignBottomY - destHeight;
  ctx.drawImage(image, 0, 0, sourceWidth, sourceHeight, 0, destY, destWidth, destHeight);
};

const getOpaqueBounds = (image) => {
  const sourceWidth = image.naturalWidth || image.width;
  const sourceHeight = image.naturalHeight || image.height;
  const probeCanvas = document.createElement('canvas');
  probeCanvas.width = sourceWidth;
  probeCanvas.height = sourceHeight;
  const probeCtx = probeCanvas.getContext('2d');
  probeCtx.drawImage(image, 0, 0, sourceWidth, sourceHeight);
  const { data } = probeCtx.getImageData(0, 0, sourceWidth, sourceHeight);

  let minX = sourceWidth;
  let minY = sourceHeight;
  let maxX = -1;
  let maxY = -1;

  for (let y = 0; y < sourceHeight; y += 1) {
    for (let x = 0; x < sourceWidth; x += 1) {
      const alpha = data[(y * sourceWidth + x) * 4 + 3];
      if (alpha < 16) continue;
      minX = Math.min(minX, x);
      minY = Math.min(minY, y);
      maxX = Math.max(maxX, x);
      maxY = Math.max(maxY, y);
    }
  }

  if (maxX < minX || maxY < minY) {
    return { x: 0, y: 0, width: sourceWidth, height: sourceHeight };
  }

  return {
    x: minX,
    y: minY,
    width: maxX - minX + 1,
    height: maxY - minY + 1,
  };
};

const drawHandheldItem = (ctx, image) => {
  const bounds = getOpaqueBounds(image);
  const scale = Math.min(ITEM_MAX_DRAW_WIDTH / bounds.width, ITEM_MAX_DRAW_HEIGHT / bounds.height);
  const drawWidth = bounds.width * scale;
  const drawHeight = bounds.height * scale;
  const destX = ITEM_HAND_ANCHOR_X - (drawWidth * 0.2);
  const destY = ITEM_HAND_ANCHOR_Y - (drawHeight * 0.88);

  ctx.drawImage(image, bounds.x, bounds.y, bounds.width, bounds.height, destX, destY, drawWidth, drawHeight);
};

const AvatarImageWithEyeOverlay = ({ skin = 'light', eye = 'brown', hair = null, hairColor = 'black', head = null, outfit = null, item = null, boots = null, width = 220, canvasRef: externalCanvasRef = null }) => {
  const internalCanvasRef = React.useRef(null);
  const canvasRef = externalCanvasRef || internalCanvasRef;
  const drawRequestRef = React.useRef(0);
  const irisColor = EYE_COLORS[eye] || EYE_COLORS.brown;
  const skinTone = SKIN_TONES[skin] || SKIN_TONES.light;
  const earOverlaySrc = EAR_OVERLAY_BY_SKIN[skin] || null;
  const scale = width / AVATAR_SOURCE_WIDTH;
  const hairStyle = hair ? HAIRSTYLES.find(h => h.id === hair) : null;
  const hairStyleSrc = getHairstyleColorSrc(hairStyle, hairColor);
  const imageGearMap = window.IMAGE_GEAR_MAP || {};
  const imageHead = head ? imageGearMap[head] : null;
  const imageOutfit = outfit ? imageGearMap[outfit] : null;
  const imageItem = item ? imageGearMap[item] : null;
  const imageBoots = boots ? imageGearMap[boots] : null;

  const redraw = React.useCallback(() => {
    const drawRequestId = drawRequestRef.current + 1;
    drawRequestRef.current = drawRequestId;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const isCurrentDraw = () => drawRequestRef.current === drawRequestId;
    const continueIfCurrent = (nextStep) => {
      if (!isCurrentDraw()) return;
      nextStep();
    };

    const drawHeadOverlay = () => {
      if (!imageHead?.avatarSrc) return;
      const headImg = new Image();
      headImg.onload = () => {
        if (!isCurrentDraw()) return;
        drawBottomAlignedImage(ctx, headImg, HEAD_OVERLAY_BOTTOM_Y + (HEAD_OVERLAY_EXTRA_Y[head] || 0));
      };
      headImg.onerror = () => {};
      headImg.src = imageHead.avatarSrc;
    };

    const drawEarOverlay = () => {
      if (!earOverlaySrc) {
        drawHeadOverlay();
        return;
      }
      const earImg = new Image();
      earImg.onload = () => {
        if (!isCurrentDraw()) return;
        const sourceWidth = earImg.naturalWidth || earImg.width;
        const sourceHeight = earImg.naturalHeight || earImg.height;
        const drawWidth = sourceWidth * EAR_OVERLAY_SCALE;
        const drawHeight = sourceHeight * EAR_OVERLAY_SCALE;
        const drawX = EAR_OVERLAY_X - ((drawWidth - sourceWidth) / 2);
        const drawY = EAR_OVERLAY_Y - ((drawHeight - sourceHeight) / 2);
        ctx.drawImage(earImg, 0, 0, sourceWidth, sourceHeight, drawX, drawY, drawWidth, drawHeight);
        drawHeadOverlay();
      };
      earImg.onerror = () => continueIfCurrent(drawHeadOverlay);
      earImg.src = earOverlaySrc;
    };

    const drawOutfitOverlay = () => {
      if (!imageOutfit?.avatarSrc) {
        drawEarOverlay();
        return;
      }
      const outfitImg = new Image();
      outfitImg.onload = () => {
        if (!isCurrentDraw()) return;
        ctx.drawImage(outfitImg, 0, CANVAS_TOP_PADDING, AVATAR_SOURCE_WIDTH, AVATAR_SOURCE_HEIGHT);
        drawEarOverlay();
      };
      outfitImg.onerror = () => continueIfCurrent(drawEarOverlay);
      outfitImg.src = imageOutfit.avatarSrc;
    };

    const drawHairOnTop = () => {
      if (!hairStyle) {
        drawOutfitOverlay();
        return;
      }
      const hairImg = new Image();
      hairImg.onload = () => {
        if (!isCurrentDraw()) return;
        const drawW = hairStyle.drawW || 950;
        const drawH = HAIR_SOURCE_HEIGHT * (drawW / HAIR_SOURCE_WIDTH);
        const x = (AVATAR_SOURCE_WIDTH - drawW) / 2 - 10 + (hairStyle.offsetX || 0);
        const y = CANVAS_TOP_PADDING - 60 + (hairStyle.offsetY || 0);
        ctx.drawImage(hairImg, x, y, drawW, drawH);
        drawOutfitOverlay();
      };
      hairImg.onerror = () => continueIfCurrent(drawOutfitOverlay);
      hairImg.src = hairStyleSrc;
    };

    const drawBootsOverlay = () => {
      if (!imageBoots?.avatarSrc) {
        drawHairOnTop();
        return;
      }
      const bootsImg = new Image();
      bootsImg.onload = () => {
        if (!isCurrentDraw()) return;
        ctx.drawImage(bootsImg, 0, CANVAS_TOP_PADDING, AVATAR_SOURCE_WIDTH, AVATAR_SOURCE_HEIGHT);
        drawHairOnTop();
      };
      bootsImg.onerror = () => continueIfCurrent(drawHairOnTop);
      bootsImg.src = imageBoots.avatarSrc;
    };

    const drawItemOverlay = () => {
      if (!imageItem?.avatarSrc) {
        drawBootsOverlay();
        return;
      }
      const itemImg = new Image();
      itemImg.onload = () => {
        if (!isCurrentDraw()) return;
        drawHandheldItem(ctx, itemImg);
        drawBootsOverlay();
      };
      itemImg.onerror = () => continueIfCurrent(drawBootsOverlay);
      itemImg.src = imageItem.avatarSrc;
    };

    const img = new Image();
    img.onload = () => {
      if (!isCurrentDraw()) return;
      canvas.width = AVATAR_SOURCE_WIDTH;
      canvas.height = AVATAR_SOURCE_HEIGHT + CANVAS_TOP_PADDING;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, CANVAS_TOP_PADDING, AVATAR_SOURCE_WIDTH, AVATAR_SOURCE_HEIGHT);

      applySkinToneByRegion(ctx, skinTone);

      if (eye !== 'brown') {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const leftRegion = { x1: 410, y1: 370 + CANVAS_TOP_PADDING, x2: 560, y2: 510 + CANVAS_TOP_PADDING };
        const rightRegion = { x1: 720, y1: 370 + CANVAS_TOP_PADDING, x2: 905, y2: 510 + CANVAS_TOP_PADDING };
        if (eye === 'hetero') {
          applyEyeColorByRegion(imageData.data, canvas.width, [leftRegion], '#833303');
          applyEyeColorByRegion(imageData.data, canvas.width, [rightRegion], '#333CE0');
        } else if (eye === 'gradient') {
          applyEyeGradientByRegion(imageData.data, canvas.width, [leftRegion, rightRegion], '#F85646', '#DCC7C7');
        } else {
          applyEyeColorByRegion(imageData.data, canvas.width, [leftRegion, rightRegion], irisColor);
        }
        ctx.putImageData(imageData, 0, 0);
      }

      drawItemOverlay();
    };
    img.src = 'clear_avatar.png?v=1';
  }, [boots, earOverlaySrc, eye, hairStyle, hairStyleSrc, head, imageBoots, imageHead, imageItem, imageOutfit, irisColor, item, outfit, skinTone]);

  React.useEffect(() => {
    redraw();
  }, [redraw]);

  return (
    <canvas
      ref={canvasRef}
      aria-label="WardrobeForge avatar"
      role="img"
      style={{
        display: 'block',
        width,
        height: (AVATAR_SOURCE_HEIGHT + CANVAS_TOP_PADDING) * scale,
        imageRendering: 'pixelated',
      }}
    />
  );
};

const applyEyeColorByRegion = (data, canvasWidth, regions, color) => {
  const rgb = hexToRgb(color);
  if (!rgb) return;
  for (const { x1, y1, x2, y2 } of regions) {
    for (let y = y1; y <= y2; y += 1) {
      for (let x = x1; x <= x2; x += 1) {
        const idx = (y * canvasWidth + x) * 4;
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];
        const a = data[idx + 3];
        if (a < 50) continue;
        const dr = r - 119;
        const dg = g - 54;
        const db = b - 4;
        const dist = Math.sqrt(dr * dr + dg * dg + db * db);
        if (dist > 55) continue;
        const pixelLum = 0.299 * r + 0.587 * g + 0.114 * b;
        const scale = Math.min(1.5, pixelLum / 75);
        data[idx] = Math.min(255, Math.round(rgb.r * scale));
        data[idx + 1] = Math.min(255, Math.round(rgb.g * scale));
        data[idx + 2] = Math.min(255, Math.round(rgb.b * scale));
      }
    }
  }
};

const SKIN_MASK_REGION = {
  x1: 250,
  y1: CANVAS_TOP_PADDING + 20,
  x2: 1030,
  y2: CANVAS_TOP_PADDING + AVATAR_SOURCE_HEIGHT - 10,
};

const clampByte = (value) => Math.max(0, Math.min(255, Math.round(value)));

const mixRgb = (colorA, colorB, amount) => ({
  r: clampByte(colorA.r + (colorB.r - colorA.r) * amount),
  g: clampByte(colorA.g + (colorB.g - colorA.g) * amount),
  b: clampByte(colorA.b + (colorB.b - colorA.b) * amount),
});

const isSkinPixel = (r, g, b, a) => {
  if (a < 40) return false;
  if (r < 150 || g < 110 || b < 75) return false;
  if (r > 255 || g > 244 || b > 225) return false;
  if (r <= g || g <= b) return false;
  if ((r - b) < 18 || (r - g) > 85 || (g - b) > 65) return false;
  return true;
};

const isSkinBorderCandidate = (r, g, b, a) => {
  if (a < 40) return false;
  if (r < 90 || r > 235) return false;
  if (g < 50 || g > 190) return false;
  if (b < 10 || b > 140) return false;
  if (r <= g || g < b) return false;
  if ((r - b) < 20 || (r - g) > 110 || (g - b) > 90) return false;
  return true;
};

const isDarkSkinShade = (r, g, b, tone) => {
  const shadow = hexToRgb(tone.shadow);
  if (!shadow) return false;
  const diff = Math.abs(r - shadow.r) + Math.abs(g - shadow.g) + Math.abs(b - shadow.b);
  return diff <= 50;
};

const touchesSkinPixel = (data, width, height, x, y, radius = 1) => {
  let nearbySkinPixels = 0;
  for (let offsetY = -radius; offsetY <= radius; offsetY += 1) {
    for (let offsetX = -radius; offsetX <= radius; offsetX += 1) {
      if (offsetX === 0 && offsetY === 0) continue;
      const sampleX = x + offsetX;
      const sampleY = y + offsetY;
      if (sampleX < 0 || sampleY < 0 || sampleX >= width || sampleY >= height) continue;
      const sampleIndex = (sampleY * width + sampleX) * 4;
      if (isSkinPixel(
        data[sampleIndex],
        data[sampleIndex + 1],
        data[sampleIndex + 2],
        data[sampleIndex + 3],
      )) {
        nearbySkinPixels += 1;
      }
    }
  }
  return nearbySkinPixels >= 1;
};

const applySkinToneByRegion = (ctx, tone) => {
  const { x1, y1, x2, y2 } = SKIN_MASK_REGION;
  const width = x2 - x1 + 1;
  const height = y2 - y1 + 1;
  const imageData = ctx.getImageData(x1, y1, width, height);
  const { data } = imageData;
  const originalData = new Uint8ClampedArray(data);
  const shadow = hexToRgb(tone.shadow);
  const mid = hexToRgb(tone.mid);
  const border = tone.border ? hexToRgb(tone.border) : null;
  if (!shadow || !mid) return;

  const highlight = mixRgb(mid, { r: 255, g: 248, b: 238 }, 0.35);

  for (let index = 0; index < data.length; index += 4) {
    const r = data[index];
    const g = data[index + 1];
    const b = data[index + 2];
    const a = data[index + 3];
    if (!isSkinPixel(r, g, b, a)) continue;

    const luminance = (0.299 * r) + (0.587 * g) + (0.114 * b);
    const toneMix = Math.max(0, Math.min(1, (luminance - 150) / 95));
    const baseColor = toneMix < 0.6
      ? mixRgb(shadow, mid, toneMix / 0.6)
      : mixRgb(mid, highlight, (toneMix - 0.6) / 0.4);

    const warmth = (r - b) / 120;
    const finalColor = mixRgb(baseColor, highlight, Math.max(0, warmth - 0.55) * 0.12);

    data[index] = finalColor.r;
    data[index + 1] = finalColor.g;
    data[index + 2] = finalColor.b;
  }

  if (border) {
    for (let y = 0; y < height; y += 1) {
      for (let x = 0; x < width; x += 1) {
        const index = (y * width + x) * 4;
        const r = originalData[index];
        const g = originalData[index + 1];
        const b = originalData[index + 2];
        const a = originalData[index + 3];
        const recoloredR = data[index];
        const recoloredG = data[index + 1];
        const recoloredB = data[index + 2];
        const shouldUseBorder =
          (isSkinBorderCandidate(r, g, b, a) && touchesSkinPixel(originalData, width, height, x, y, 2))
          || (isSkinPixel(r, g, b, a) && isDarkSkinShade(recoloredR, recoloredG, recoloredB, tone));
        if (!shouldUseBorder) continue;
        data[index] = border.r;
        data[index + 1] = border.g;
        data[index + 2] = border.b;
      }
    }
  }

  ctx.putImageData(imageData, x1, y1);
};

const applyEyeGradientByRegion = (data, canvasWidth, regions, colorA, colorB) => {
  const rgbA = hexToRgb(colorA);
  const rgbB = hexToRgb(colorB);
  if (!rgbA || !rgbB) return;
  for (const { x1, y1, x2, y2 } of regions) {
    const spanX = x2 - x1 || 1;
    const spanY = y2 - y1 || 1;
    for (let y = y1; y <= y2; y += 1) {
      for (let x = x1; x <= x2; x += 1) {
        const idx = (y * canvasWidth + x) * 4;
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];
        const a = data[idx + 3];
        if (a < 50) continue;
        const dr = r - 119;
        const dg = g - 54;
        const db = b - 4;
        if (Math.sqrt(dr * dr + dg * dg + db * db) > 55) continue;
        const t = ((x - x1) / spanX + (y - y1) / spanY) / 2;
        const gr = Math.round(rgbA.r + (rgbB.r - rgbA.r) * t);
        const gg = Math.round(rgbA.g + (rgbB.g - rgbA.g) * t);
        const gb = Math.round(rgbA.b + (rgbB.b - rgbA.b) * t);
        const pixelLum = 0.299 * r + 0.587 * g + 0.114 * b;
        const scale = Math.min(1.5, pixelLum / 75);
        data[idx] = Math.min(255, Math.round(gr * scale));
        data[idx + 1] = Math.min(255, Math.round(gg * scale));
        data[idx + 2] = Math.min(255, Math.round(gb * scale));
      }
    }
  }
};

const hexToRgb = (hex) => {
  const normalized = hex.replace('#', '');
  if (normalized.length !== 6) return null;
  return {
    r: parseInt(normalized.slice(0, 2), 16),
    g: parseInt(normalized.slice(2, 4), 16),
    b: parseInt(normalized.slice(4, 6), 16),
  };
};

window.AvatarPage = AvatarPage;

</script>

<script type="text/babel">
/* ============= Top Up page ============= */

const TOP_UP_PACKAGES = [
  { id: 'topup-100', price: 1.99, tokens: 100, tier: 1, badge: 'START', imageSrc: 'assets/top up/1.png' },
  { id: 'topup-400', price: 5.99, tokens: 400, tier: 2, badge: 'BOOST', imageSrc: 'assets/top up/2.png' },
  { id: 'topup-1700', price: 25.99, tokens: 1700, tier: 3, badge: 'STACK', imageSrc: 'assets/top up/3.png' },
  { id: 'topup-3600', price: 50.99, tokens: 3600, tier: 4, badge: 'DROP', imageSrc: 'assets/top up/4.png' },
  { id: 'topup-15500', price: 200.99, tokens: 15500, tier: 5, badge: 'VAULT', imageSrc: 'assets/top up/5.png' },
  { id: 'topup-custom', price: null, tokens: null, tier: 6, badge: 'CUSTOM', custom: true, imageSrc: 'assets/top up/6.png' },
];

const TOP_UP_CUSTOM_RATE = 1.99 / 100;

const formatUsd = (amount) => `$${amount.toFixed(2)}`;

const TopUpCard = ({ pack, onClaim, busy, onOpenCustom }) => (
  <div className={`pxl-box topup-card ${pack.custom ? 'topup-card-custom' : ''}`}>
    <div className="topup-card-badge">{pack.badge}</div>
    <div className="topup-card-stage">
      <img className="topup-card-image" src={pack.imageSrc} alt={pack.custom ? 'Custom top up pack' : `${pack.tokens.toLocaleString()} token pack`} />
    </div>
    <div className="topup-card-lower">
      <div className="pixel topup-card-amount">{pack.custom ? 'CUSTOM' : `${pack.tokens.toLocaleString()} TOKENS`}</div>
      <div className="mono topup-card-price">{pack.custom ? 'SLIDER' : formatUsd(pack.price)}</div>
      <button className="pxl-btn topup-card-cta" onClick={pack.custom ? onOpenCustom : () => onClaim(pack.tokens)}>
        {pack.custom ? 'OPEN' : busy ? 'ADDING...' : 'TOP UP'}
      </button>
    </div>
  </div>
);

const TopUpPage = ({ currentUser, goto, openAuthModal }) => {
  const accountSnapshot = React.useMemo(
    () => window.WardrobeForgeAuth?.getAccountSnapshot?.(currentUser?.id) || { balance: 300 },
    [currentUser],
  );
  const [customTokens, setCustomTokens] = React.useState(2500);
  const [status, setStatus] = React.useState('');
  const [busyAmount, setBusyAmount] = React.useState(null);
  const [isCustomOpen, setIsCustomOpen] = React.useState(false);
  const customPrice = Number((customTokens * TOP_UP_CUSTOM_RATE).toFixed(2));

  const handleTopUp = (amount) => {
    if (!currentUser) {
      setStatus('Sign in to add tokens to your backend-linked WardrobeForge profile on this device.');
      if (openAuthModal) openAuthModal();
      return;
    }

    setBusyAmount(amount);
    setStatus('');
    try {
      window.WardrobeForgeAuth?.addVtoBalance?.({
        userId: currentUser.id,
        amount,
      });
      setStatus(`${amount.toLocaleString()} tokens added to ${currentUser.displayName}.`);
    } catch (error) {
      setStatus(error.message || 'Could not add tokens right now.');
    } finally {
      setBusyAmount(null);
    }
  };

  return (
    <div className="page">
      <div className="pxl-box topup-hero-main">
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
          <h1 className="pixel" style={{ fontSize: 26 }}>TOP UP</h1>
          <span className="mono" style={{ fontSize: 20, opacity: .65 }}>// restock your wallet for more crate rolls</span>
        </div>

        <div className="topup-balance-row">
          <span className="chip">CURRENT BALANCE</span>
          <img className="vto-token-icon" src="assets/token.png" alt="VTO token" />
          <span className="pixel" style={{ fontSize: 18, color: 'var(--coral)' }}>{accountSnapshot.balance.toLocaleString()}</span>
        </div>

        <div className="topup-grid">
          {TOP_UP_PACKAGES.map((pack) => (
            <TopUpCard
              key={pack.id}
              pack={pack}
              busy={busyAmount === pack.tokens}
              onClaim={handleTopUp}
              onOpenCustom={() => setIsCustomOpen(true)}
            />
          ))}
        </div>
      </div>

      <div className="pxl-box" style={{ background: '#fff', padding: 24, marginTop: 28 }}>
        <div className="pixel" style={{ fontSize: 14, marginBottom: 10 }}>TOP-UP NOTES</div>
        <div className="mono" style={{ fontSize: 19, lineHeight: 1.5 }}>
          {status || 'This is still a prototype checkout. Auth now comes from the shared backend, while test top-ups still change the signed-in device profile for wardrobe testing.'}
        </div>
        {!currentUser && (
          <div style={{ marginTop: 18 }}>
            <button className="pxl-btn" onClick={() => goto('account')}>SIGN IN TO TOP UP</button>
          </div>
        )}
      </div>

      {isCustomOpen && (
        <div className="topup-modal-backdrop" onClick={() => setIsCustomOpen(false)}>
          <div className="topup-modal-shell" onClick={(event) => event.stopPropagation()}>
            <div className="pxl-box topup-custom-card">
              <div style={{ display: 'flex', justifyContent: 'space-between', gap: 16, alignItems: 'flex-start', marginBottom: 16 }}>
                <div>
                  <div className="chip coral" style={{ marginBottom: 12 }}>CUSTOM</div>
                  <div className="pixel" style={{ fontSize: 20, marginBottom: 10 }}>BUILD YOUR STACK</div>
                </div>
                <button className="auth-modal-close" onClick={() => setIsCustomOpen(false)} aria-label="Close custom top up">X</button>
              </div>

              <p className="mono" style={{ fontSize: 20, lineHeight: 1.45, opacity: .78, marginBottom: 18 }}>
                Slide to choose your token amount. Custom pricing uses the same prototype conversion rate of $1.99 per 100 tokens.
              </p>

              <div className="topup-custom-preview">
                <img className="topup-card-image" src="assets/top up/6.png" alt="Custom top up pack" />
              </div>

              <div className="topup-custom-metrics">
                <div>
                  <div className="pixel" style={{ fontSize: 10, color: 'var(--coral)', marginBottom: 6 }}>TOKENS</div>
                  <div className="pixel" style={{ fontSize: 18 }}>{customTokens.toLocaleString()}</div>
                </div>
                <div>
                  <div className="pixel" style={{ fontSize: 10, color: 'var(--coral)', marginBottom: 6 }}>PRICE</div>
                  <div className="pixel" style={{ fontSize: 18 }}>{formatUsd(customPrice)}</div>
                </div>
              </div>

              <input
                className="topup-slider"
                type="range"
                min="100"
                max="20000"
                step="100"
                value={customTokens}
                onChange={(event) => setCustomTokens(Number(event.target.value))}
              />

              <div className="topup-slider-scale">
                <span>100</span>
                <span>10,000</span>
                <span>20,000</span>
              </div>

              <button className="pxl-btn topup-custom-cta" onClick={() => handleTopUp(customTokens)}>
                {busyAmount === customTokens ? 'ADDING...' : 'TOP UP CUSTOM'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

window.TopUpPage = TopUpPage;

</script>

<script type="text/babel">
/* ============= App shell + router ============= */

const { useState: useStateApp, useEffect: useEffectApp } = React;

const App = () => {
  const authApi = window.WardrobeForgeAuth;
  const AuthModalComponent = window.AuthModal;
  const [page, setPage] = useStateApp(() => {
    const h = window.location.hash.replace('#', '') || 'main';
    return h;
  });
  const [nftFocus, setNftFocus] = useStateApp(null);
  const [avatarEquipRequest, setAvatarEquipRequest] = useStateApp(null);
  const [currentUser, setCurrentUser] = useStateApp(() => authApi?.getCurrentUser?.() || null);
  const [isAuthModalOpen, setIsAuthModalOpen] = useStateApp(false);
  const [tweaks, setTweak] = useTweaks(/*EDITMODE-BEGIN*/{
    "accent": "#F85646",
    "scanlines": true,
    "skin": "lavender",
    "fontScale": 1
  }/*EDITMODE-END*/);

  useEffectApp(() => {
    document.documentElement.style.setProperty('--coral', tweaks.accent);
    document.documentElement.style.fontSize = (16 * tweaks.fontScale) + 'px';
  }, [tweaks.accent, tweaks.fontScale]);

  const goto = (p, focus, equipRequest = null) => {
    setPage(p);
    if (focus) setNftFocus(focus);
    if (equipRequest) setAvatarEquipRequest(equipRequest);
    window.location.hash = p;
    window.scrollTo(0, 0);
  };

  const openAuthModal = () => setIsAuthModalOpen(true);
  const closeAuthModal = () => setIsAuthModalOpen(false);

  useEffectApp(() => {
    const onHash = () => setPage(window.location.hash.replace('#', '') || 'main');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffectApp(() => {
    if (!authApi?.AUTH_CHANGE_EVENT) return undefined;

    const syncUser = () => {
      setCurrentUser(authApi.getCurrentUser());
    };

    window.addEventListener(authApi.AUTH_CHANGE_EVENT, syncUser);
    window.addEventListener('storage', syncUser);
    return () => {
      window.removeEventListener(authApi.AUTH_CHANGE_EVENT, syncUser);
      window.removeEventListener('storage', syncUser);
    };
  }, [authApi]);

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <Nav page={page} goto={goto} currentUser={currentUser} />

      <main style={{ flex: 1 }} className={tweaks.scanlines ? '' : 'no-scanlines'}>
        {page === 'main' && <MainPage goto={goto} currentUser={currentUser} />}
        {page === 'avatar' && <AvatarPage currentUser={currentUser} goto={goto} openAuthModal={openAuthModal} equipRequest={avatarEquipRequest} />}
        {page === 'nfts' && <NFTsPage initialId={nftFocus} goto={goto} currentUser={currentUser} openAuthModal={openAuthModal} />}
        {page === 'topup' && <TopUpPage currentUser={currentUser} goto={goto} openAuthModal={openAuthModal} />}
        {page === 'account' && <AuthPage goto={goto} />}
        {page === 'privacy' && <PrivacyPage />}
        {page === 'terms' && <TermsPage />}
      </main>

      <Footer goto={goto} />
      {AuthModalComponent && <AuthModalComponent open={isAuthModalOpen} goto={goto} onClose={closeAuthModal} />}

      <TweaksPanel title="Tweaks">
        <TweakSection title="Look & Feel">
          <TweakColor label="Accent color" value={tweaks.accent} onChange={v => setTweak('accent', v)} />
          <TweakToggle label="CRT scanlines" value={tweaks.scanlines} onChange={v => setTweak('scanlines', v)} />
          <TweakSlider label="Font scale" min={0.85} max={1.2} step={0.05} value={tweaks.fontScale} onChange={v => setTweak('fontScale', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
};

const Nav = ({ page, goto, currentUser }) => {
  const handleLogout = () => {
    window.WardrobeForgeAuth?.logOut?.();
    goto('account');
  };

  return (
    <nav className="nav">
      <div className="logo" onClick={() => goto('main')}>
        <img src="assets/logo.png?v=2" alt="WardrobeForge" />
        <span>WARDROBE<span style={{ color: 'var(--coral)' }}>FORGE</span></span>
      </div>
      <div className="links">
        <div className={`link ${page === 'main' ? 'active' : ''}`} onClick={() => goto('main')}>HOME</div>
        <div className={`link ${page === 'avatar' ? 'active' : ''}`} onClick={() => goto('avatar')}>MY AVATAR</div>
        <div className={`link ${page === 'nfts' ? 'active' : ''}`} onClick={() => goto('nfts')}>CLOTHING NFTS</div>
        <div className={`link ${page === 'topup' ? 'active' : ''}`} onClick={() => goto('topup')}>TOP UP</div>
        <div className={`link ${page === 'privacy' ? 'active' : ''}`} onClick={() => goto('privacy')}>PRIVACY</div>
        <div className={`link ${page === 'terms' ? 'active' : ''}`} onClick={() => goto('terms')}>TERMS</div>
      </div>
      <div className="nav-account">
        {currentUser ? (
          <>
            <div className="nav-account-pill">
              <span className="chip coral">LIVE</span>
              <span className="mono">{currentUser.displayName}</span>
            </div>
            <button className="pxl-btn ghost" onClick={handleLogout}>LOG OUT</button>
          </>
        ) : (
          <button className="pxl-btn" onClick={() => goto('account')}>SIGN IN</button>
        )}
      </div>
    </nav>
  );
};

const Footer = ({ goto }) => (
  <footer className="foot">
    <div style={{ marginBottom: 14 }}>? WARDROBEFORGE · 2026 · EVERY THREAD A TWIN</div>
    <div>
      <a onClick={() => goto('main')} style={{ cursor: 'pointer' }}>HOME</a>·
      <a onClick={() => goto('avatar')} style={{ cursor: 'pointer' }}>AVATAR</a>·
      <a onClick={() => goto('nfts')} style={{ cursor: 'pointer' }}>NFTS</a>·
      <a onClick={() => goto('topup')} style={{ cursor: 'pointer' }}>TOP UP</a>·
      <a onClick={() => goto('account')} style={{ cursor: 'pointer' }}>SIGN IN / SIGN UP</a>·
      <a onClick={() => goto('privacy')} style={{ cursor: 'pointer' }}>PRIVACY</a>·
      <a onClick={() => goto('terms')} style={{ cursor: 'pointer' }}>TERMS</a>
    </div>
  </footer>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
