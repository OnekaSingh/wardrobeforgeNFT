<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WardrobeForge — Every Thread, A Twin</title>
<link rel="icon" href="assets/logo.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* ============= WardrobeForge — pixel game UI ============= */

@font-face {
  font-family: 'PressStart';
  src: url('https://fonts.gstatic.com/s/pressstart2p/v15/e3t4euO8T-267oIAQAu6jDQyK3nVivM.woff2') format('woff2');
  font-display: swap;
}

:root{
  --coral:#F85646;
  --coral-deep:#D43A2C;
  --coral-soft:#FF7E70;
  --pink:#DCC7C7;
  --pink-soft:#F2E3E3;
  --pink-neon:#FFB8C8;
  --mint:#B8F2D8;
  --sky:#A8DEFF;
  --lemon:#FFE9A8;
  --lavender:#D4B8FF;
  --white:#FFFFFF;
  --ink:#2A1B1B;
  --ink-2:#333333;
  --paper:#FFF7F2;
  --paper-2:#F8E9E5;
  --shadow:#2A1B1B;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  font-family: 'VT323', 'Courier New', monospace;
  background: var(--paper);
  color: var(--ink);
  font-size: 22px;
  line-height: 1.25;
  image-rendering: pixelated;
  -webkit-font-smoothing: none;
  font-smooth: never;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
  display: none;
}

img{image-rendering: pixelated; image-rendering:-moz-crisp-edges;}

a{color:inherit; text-decoration:none}

/* ----- pixel utility classes ----- */
.pixel{font-family:'PressStart', 'VT323', monospace; letter-spacing:.02em}
.mono{font-family:'VT323', monospace}

/* checkered dithered background */
.dither-bg{
  background-color: var(--paper);
  background-image:
    linear-gradient(45deg, var(--paper-2) 25%, transparent 25%),
    linear-gradient(-45deg, var(--paper-2) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--paper-2) 75%),
    linear-gradient(-45deg, transparent 75%, var(--paper-2) 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}
.cloud-bg{
  background:
    radial-gradient(ellipse at 10% 20%, var(--pink-neon) 0%, transparent 30%),
    radial-gradient(ellipse at 90% 30%, var(--sky) 0%, transparent 32%),
    radial-gradient(ellipse at 30% 80%, var(--lemon) 0%, transparent 28%),
    radial-gradient(ellipse at 80% 90%, var(--lavender) 0%, transparent 30%),
    var(--paper);
}

/* chunky pixel border via box-shadow stair-step */
.pxl-box{
  background: var(--white);
  position:relative;
  box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink),
    0 8px 0 0 var(--coral);
}
.pxl-box.no-drop{ box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink);
}
.pxl-box.deep{
  box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink),
    8px 8px 0 0 var(--ink),
    8px 8px 0 4px var(--coral);
}
.pxl-box.coral{ background: var(--coral); color: var(--white) }
.pxl-box.pink{ background: var(--pink); }
.pxl-box.dark{ background: var(--ink); color: var(--white) }

/* pixel button */
.pxl-btn{
  font-family:'PressStart', monospace;
  font-size: 12px;
  letter-spacing:.04em;
  background: var(--coral);
  color: var(--white);
  border:none;
  padding: 14px 18px;
  cursor:pointer;
  position:relative;
  text-transform:uppercase;
  box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink),
    0 8px 0 0 var(--coral-deep);
  transition: transform .08s steps(2);
}
.pxl-btn:hover{ filter: brightness(1.05) }
.pxl-btn:active{ transform: translateY(4px); box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink);
}
.pxl-btn.ghost{ background: var(--white); color: var(--ink); box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink),
    0 8px 0 0 var(--pink);
}
.pxl-btn.ghost:active{ transform: translateY(4px); box-shadow:
    0 -4px 0 0 var(--ink),
    0 4px 0 0 var(--ink),
    -4px 0 0 0 var(--ink),
    4px 0 0 0 var(--ink);
}

/* sparkle pulse */
@keyframes sparkle{
  0%,100%{opacity:1; transform:scale(1)}
  50%{opacity:.4; transform:scale(.7)}
}
.sparkle{ animation: sparkle 1.6s steps(4) infinite }

/* float */
@keyframes floaty{
  0%,100%{transform: translateY(0)}
  50%{transform: translateY(-6px)}
}
.float{ animation: floaty 2.4s steps(8) infinite }
.vto-balance-badge{
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: nowrap;
}
.vto-balance-actions{
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  flex-wrap: wrap;
}
.vto-balance-topup-btn{
  white-space: nowrap;
}
.vto-token-icon{
  width: 22px;
  height: 22px;
  image-rendering: pixelated;
  flex: 0 0 auto;
}
.star-power-icons{
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: flex-start;
  width: fit-content;
}
.star-power-icon{
  width: 18px;
  height: 18px;
  image-rendering: pixelated;
  flex: 0 0 auto;
}

/* twinkle */
@keyframes twinkle{
  0%,100%{opacity:.2}
  50%{opacity:1}
}
.twinkle{ animation: twinkle 1.4s steps(3) infinite }

/* press-start glitch */
@keyframes blink{ 50%{opacity:0} }
.blink{ animation: blink 1s steps(2) infinite }

/* scanline overlay (subtle) */
.scanlines::after{
  content:'';
  position:absolute; inset:0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,.05) 0 2px,
    transparent 2px 4px
  );
  pointer-events:none;
  mix-blend-mode: multiply;
}

/* nav */
.nav{
  position: sticky; top:0; z-index:50;
  background: var(--white);
  border-bottom: 4px solid var(--ink);
  padding: 14px 24px;
  display:flex; align-items:center; gap: 18px;
  flex-wrap: wrap;
}
.nav .logo{
  display:flex; align-items:center; gap:10px;
  cursor:pointer;
}
.nav .logo img{ width: 38px; height:38px }
.nav .logo span{ font-family:'PressStart', monospace; font-size:14px }
.nav .links{ display:flex; gap: 6px; flex-wrap:wrap; margin-left:auto }
.nav .link{
  font-family:'PressStart', monospace;
  font-size:10px;
  padding: 10px 12px;
  cursor:pointer;
  letter-spacing:.04em;
  color: var(--ink);
  border: 3px solid transparent;
  text-transform: uppercase;
}
.nav .link:hover{ background: var(--paper-2) }
.nav .link.active{
  background: var(--ink);
  color: var(--white);
  border-color: var(--ink);
  box-shadow: 0 4px 0 0 var(--coral);
}
.nav-account{
  display:flex;
  align-items:center;
  gap:10px;
}
.nav-account-pill{
  display:flex;
  align-items:center;
  gap:8px;
  padding: 8px 12px;
  background: var(--paper-2);
  border: 3px solid var(--ink);
  min-height: 48px;
}

.auth-hero{
  display:grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(300px, .7fr);
  gap: 24px;
  align-items: start;
}
.auth-hero-embedded{
  grid-template-columns: minmax(0, 1fr) minmax(280px, .62fr);
}
.auth-card{
  padding: 26px;
}
.auth-card-main{
  background:
    radial-gradient(circle at top right, rgba(255,184,200,.55), transparent 30%),
    linear-gradient(180deg, #fff 0%, #fff7f2 100%);
}
.auth-card-side{
  min-height: 100%;
}
.auth-prompt-card{
  max-width: 720px;
  margin: 0 auto;
}
.topup-hero{
  display:grid;
  grid-template-columns: minmax(0, 1.32fr) minmax(320px, .68fr);
  gap: 24px;
  align-items: start;
}
.topup-hero-main{
  background:
    radial-gradient(circle at top right, rgba(168,222,255,.52), transparent 28%),
    linear-gradient(180deg, #fff 0%, #f7fbff 100%);
  padding: 26px;
}
.topup-balance-row{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom: 22px;
}
.topup-grid{
  display:grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 18px;
}
.topup-card{
  position: relative;
  background: #fff;
  overflow: hidden;
}
.topup-card-custom{
  background: #fff;
}
.topup-card-badge{
  position:absolute;
  top:12px;
  right:12px;
  padding: 6px 8px;
  background: #ffb8c8;
  color: var(--ink);
  font-family:'PressStart', monospace;
  font-size: 8px;
  box-shadow: 0 0 0 3px rgba(42,27,27,.18);
}
.topup-card-stage{
  height: 164px;
  margin: 16px 16px 0;
  border: 3px solid rgba(255,255,255,.84);
  background: #fff;
  position: relative;
  overflow: hidden;
}
.topup-card-stage::after{
  content:'';
  position:absolute;
  inset: auto 0 0 0;
  height: 28px;
  background: linear-gradient(180deg, rgba(255,255,255,.15), rgba(255,255,255,.45));
}
.topup-card-image{
  width: min(100%, 240px);
  max-height: 132px;
  object-fit: contain;
  image-rendering: pixelated;
  display: block;
  margin: 12px auto 0;
}
.topup-card-amount{
  font-size: 13px;
  margin-bottom: 12px;
  text-align:center;
  color: #fff;
}
.topup-card-price{
  font-size: 22px;
  text-align:center;
  margin-bottom: 18px;
  color: #fff;
}
.topup-card-lower{
  margin-top: 0;
  padding: 18px 16px 18px;
  background: var(--ink);
}
.topup-card-cta,
.topup-custom-cta{
  width:100%;
}
.topup-custom-card{
  padding: 26px;
  background:
    radial-gradient(circle at top right, rgba(255,184,200,.44), transparent 26%),
    linear-gradient(180deg, #fff 0%, #fff7f1 100%);
}
.topup-modal-backdrop{
  position: fixed;
  inset: 0;
  background: rgba(42,27,27,.74);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 130;
}
.topup-modal-shell{
  width: min(760px, 100%);
}
.topup-custom-preview{
  height: 170px;
  margin-bottom: 16px;
  border: 4px solid var(--ink);
  background: #fff;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.topup-custom-metrics{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
.topup-slider{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  height:8px;
  background: linear-gradient(90deg, #ffe9a8 0%, #f85646 100%);
  border: 3px solid var(--ink);
  margin: 10px 0 12px;
}
.topup-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:20px;
  height:20px;
  background: var(--white);
  border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 0 var(--coral);
}
.topup-slider::-moz-range-thumb{
  width:20px;
  height:20px;
  background: var(--white);
  border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 0 var(--coral);
}
.topup-slider-scale{
  display:flex;
  justify-content:space-between;
  font-family:'PressStart', monospace;
  font-size: 8px;
  color: rgba(42,27,27,.65);
  margin-bottom: 18px;
}
.auth-shell,
.auth-session{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.auth-form{
  display:flex;
  flex-direction:column;
  gap:14px;
  max-width: 540px;
}
.auth-field{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.auth-field span{
  font-size: 10px;
}
.auth-field input{
  width:100%;
  border: 4px solid var(--ink);
  background: #fff;
  color: var(--ink);
  padding: 14px 16px;
  font: inherit;
  font-size: 22px;
}
.auth-field input:focus{
  outline: 4px solid var(--coral);
  outline-offset: 2px;
}
.auth-feedback{
  padding: 12px 14px;
  border-left: 4px solid var(--ink);
  font-size: 20px;
}
.auth-feedback-error{
  background: #ffe2dc;
  color: #7c2219;
  border-left-color: var(--coral-deep);
}
.auth-feedback-success{
  background: #e5fff0;
  color: #124f2d;
  border-left-color: #2b8f54;
}
.auth-benefits{
  display:flex;
  flex-direction:column;
  gap:18px;
  font-size: 20px;
  line-height: 1.4;
}
.auth-modal-backdrop{
  position: fixed;
  inset: 0;
  background: rgba(42, 27, 27, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 120;
}
.auth-modal-shell{
  width: min(760px, 100%);
}
.auth-modal-close{
  border: 3px solid var(--ink);
  background: transparent;
  color: var(--white);
  font-family:'PressStart', monospace;
  font-size: 10px;
  padding: 10px 12px;
  cursor: pointer;
  line-height: 1;
}
.auth-modal-close:hover{
  background: rgba(255,255,255,.08);
}
.auth-prompt-cta{
  margin-top: 22px;
  width: 100%;
}

/* page wrap */
.page{
  max-width: 1240px; margin: 0 auto;
  padding: 36px 24px 80px;
}

.avatar-page-grid{
  display:grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 24px;
  align-items: start;
}

.avatar-stage{
  position: relative;
  min-height: 824px;
  overflow: hidden;
}

.avatar-stage-sidebar{
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 0;
  width: auto;
  max-width: none;
  align-items: flex-start;
  padding-bottom: 24px;
  box-sizing: border-box;
}

.avatar-loadout-panel{
  display: flex;
  flex-direction: column;
}

.avatar-inventory-grid{
  overflow-x: hidden;
  box-sizing: border-box;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.avatar-inventory-grid::-webkit-scrollbar{
  display: none;
}

.inventory-auth-id-btn{
  position: absolute;
  top: 4px;
  left: 4px;
  z-index: 3;
  border: 3px solid var(--ink);
  background: var(--white);
  color: var(--ink);
  font-family:'PressStart', monospace;
  font-size: 8px;
  line-height: 1;
  padding: 7px 8px 6px;
  cursor: pointer;
  box-shadow: 0 3px 0 0 var(--pink);
}

.inventory-auth-id-btn.active{
  background: var(--ink);
  color: var(--white);
  box-shadow: 0 3px 0 0 var(--coral);
}

.inventory-auth-id-popover{
  position: absolute;
  top: 34px;
  left: 4px;
  right: 4px;
  z-index: 4;
  padding: 10px 12px;
  background: rgba(255,255,255,.97);
  border: 3px solid var(--ink);
  box-shadow: 0 4px 0 0 var(--coral);
}

.inventory-auth-id-label{
  font-size: 8px;
  color: var(--coral);
  margin-bottom: 6px;
}

.inventory-auth-id-value{
  font-size: 14px;
  line-height: 1.25;
  word-break: break-all;
}

.avatar-stage-figure{
  position: absolute;
  left: 53%;
  top: 32%;
  transform: translate(-50%, -50%);
  z-index: 3;
}

.avatar-stage-sidebar,
.avatar-stage-nameplate,
.avatar-stage-switcher,
.avatar-stage-selectors{
  z-index: 2;
}

.avatar-stage-selectors{
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: max-content;
  max-width: 100%;
}

.avatar-stage-nameplate{
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 100%;
  margin-top: 14px;
  margin-bottom: 0;
  z-index: 1;
}

.avatar-stage-identity,
.avatar-stage-xp{
  width: 100%;
  min-width: 0;
}

/* footer */
.foot{
  border-top: 4px solid var(--ink);
  background: var(--ink); color: var(--white);
  padding: 28px 24px;
  text-align:center;
  font-family:'PressStart', monospace;
  font-size: 10px;
  letter-spacing:.06em;
}
.foot a{ color: var(--coral-soft); margin: 0 8px }

/* heading styles */
h1.pixel{ font-size: 28px; line-height:1.2; }
h2.pixel{ font-size: 18px; line-height:1.3; }
h3.pixel{ font-size: 12px; line-height:1.4; letter-spacing:.06em }

.heart{color:var(--coral)}

/* hr - dotted pixel */
.pxl-hr{
  height: 4px;
  background-image: linear-gradient(to right, var(--ink) 50%, transparent 50%);
  background-size: 12px 4px;
  background-repeat: repeat-x;
  border: none;
  margin: 16px 0;
}

/* tag chip */
.chip{
  font-family:'PressStart', monospace;
  font-size: 9px;
  padding: 6px 8px;
  background: var(--ink);
  color: var(--white);
  display:inline-block;
  letter-spacing:.04em;
}
.chip.coral{ background: var(--coral) }
.chip.pink{ background: var(--pink); color: var(--ink) }
.chip.mint{ background: var(--mint); color: var(--ink) }
.chip.sky{ background: var(--sky); color: var(--ink) }
.chip.lemon{ background: var(--lemon); color: var(--ink) }
.chip.lavender{ background: var(--lavender); color: var(--ink) }

/* health/xp bar */
.bar{
  height: 14px;
  background: var(--ink);
  position: relative;
  border: 2px solid var(--ink);
}
.bar > i{
  display:block; height: 100%;
  background: linear-gradient(to right, var(--coral) 0%, var(--coral-soft) 100%);
}
.bar.green > i{ background: linear-gradient(to right, #6BCB77, var(--mint)) }
.bar.blue > i{ background: linear-gradient(to right, #4D9DE0, var(--sky)) }
.bar.purple > i{ background: linear-gradient(to right, #8E5CF7, var(--lavender)) }

/* select / radio pixel chips */
.opts{ display:flex; flex-wrap:wrap; gap:6px }
.opt{
  font-family:'PressStart', monospace;
  font-size: 9px;
  padding: 8px 10px;
  border: 3px solid var(--ink);
  background: var(--white);
  cursor:pointer;
  text-transform:uppercase;
}
.opt:hover{ background: var(--paper-2) }
.opt.active{ background: var(--ink); color: var(--white) }
.opt.coral.active{ background: var(--coral) }

/* card grid */
.grid{
  display:grid; gap: 28px;
}
.grid.cols-3{ grid-template-columns: repeat(3, minmax(0,1fr)) }
.grid.cols-4{ grid-template-columns: repeat(4, minmax(0,1fr)) }
.grid.cols-2{ grid-template-columns: repeat(2, minmax(0,1fr)) }
@media (max-width: 900px){
  .grid.cols-3, .grid.cols-4{ grid-template-columns: repeat(2, minmax(0,1fr)) }
  .auth-hero{ grid-template-columns: 1fr; }
  .auth-hero-embedded{ grid-template-columns: 1fr; }
  .topup-hero{ grid-template-columns: 1fr; }
  .topup-grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 600px){
  .grid.cols-2, .grid.cols-3, .grid.cols-4{ grid-template-columns: 1fr }
  .topup-grid{ grid-template-columns: 1fr; }
}

@media (max-width: 1100px){
  .avatar-stage-figure{
    left: 64%;
    top: 39%;
  }

  .avatar-stage-sidebar{
    max-width: none;
  }
}

@media (max-width: 1500px){
  .avatar-stage{
    min-height: 624px;
  }
}

@media (max-width: 760px){
  .nav-account{
    width:100%;
    justify-content:flex-start;
  }

  .nav-account-pill{
    min-width: 0;
  }

  .avatar-page-grid{
    grid-template-columns: 1fr;
  }

  .avatar-stage{
    min-height: 632px;
  }

  .avatar-stage-figure{
    left: 62%;
    top: 33%;
  }

  .avatar-stage-sidebar{
    width: calc(100% - 32px);
    max-width: none;
  }

  .avatar-stage-nameplate{
    gap: 18px;
  }

  .avatar-stage-identity,
  .avatar-stage-xp{
    width: 100%;
    min-width: 0;
  }
}

@media (max-width: 520px){
  .auth-card{
    padding: 18px;
  }

  .avatar-stage{
    min-height: 652px;
  }

  .avatar-stage-figure{
    left: 61%;
    top: 32%;
  }

  .avatar-stage-sidebar{
    width: calc(100% - 28px);
    max-width: none;
  }
}

/* nft card */
.nft-card{
  background: var(--white);
  padding: 16px;
  cursor:pointer;
  position: relative;
  transition: transform .1s steps(2);
}
.nft-card:hover{ transform: translate(-2px,-2px) }
.nft-thumb{
  background: var(--paper-2);
  aspect-ratio: 1/1;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  overflow:hidden;
}
.nft-thumb.dither-bg{ background-color: var(--paper-2) }

.crate-grid{
  align-items: stretch;
}
.crate-card{
  border: none;
  text-align: center;
  padding: 20px 18px 22px;
  cursor: pointer;
  transition: transform .12s steps(2), filter .12s steps(2);
}
.crate-card:hover{
  transform: translate(-2px,-2px);
  filter: brightness(1.03);
}
.crate-card.active{
  outline: 4px solid var(--coral);
  outline-offset: 6px;
}
.crate-image-wrap{
  min-height: 176px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}
.crate-image{
  width: 150px;
  height: auto;
  display: block;
  image-rendering: auto;
  filter: drop-shadow(0 14px 0 rgba(42,27,27,.12));
}
.crate-image-large{
  width: 240px;
}
.crate-sunflare .crate-image,
.crate-image.crate-sunflare{
  filter: hue-rotate(0deg) saturate(1.05) brightness(1.02) drop-shadow(0 14px 0 rgba(212,58,44,.16));
}
.crate-nebula .crate-image,
.crate-image.crate-nebula{
  filter: hue-rotate(168deg) saturate(1.16) brightness(1.01) drop-shadow(0 14px 0 rgba(120,98,190,.2));
}
.crate-verdant .crate-image,
.crate-image.crate-verdant{
  filter: hue-rotate(68deg) saturate(1.1) brightness(0.98) drop-shadow(0 14px 0 rgba(75,133,102,.18));
}
.crate-aurora .crate-image,
.crate-image.crate-aurora{
  filter: hue-rotate(112deg) saturate(1.18) brightness(1.02) drop-shadow(0 14px 0 rgba(76,132,192,.18));
}
.crate-detail-shell{
  overflow: hidden;
}
.crate-detail-split{
  grid-template-columns: .9fr 1.1fr;
}
.crate-detail-hero{
  position: relative;
  min-height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-right: 4px solid var(--ink);
}
.crate-detail-hero.crate-sunflare{
  background:
    radial-gradient(circle at 20% 18%, rgba(255,255,255,.7), transparent 22%),
    linear-gradient(180deg, #fff4bf 0%, #ffd768 58%, #f7b24c 100%);
}
.crate-detail-hero.crate-nebula{
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.7), transparent 22%),
    linear-gradient(180deg, #f8e9ff 0%, #d9c4ff 56%, #b792ff 100%);
}
.crate-detail-hero.crate-verdant{
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.7), transparent 22%),
    linear-gradient(180deg, #eef9d5 0%, #cfe89d 56%, #a9d27d 100%);
}
.crate-detail-hero.crate-aurora{
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.72), transparent 22%),
    linear-gradient(180deg, #e9f7ff 0%, #bfe0ff 56%, #84bfff 100%);
}
.crate-detail-image-stack{
  position: relative;
  padding: 30px;
}
.crate-detail-open-wrap{
  position: absolute;
  left: 50%;
  bottom: 86px;
  transform: translateX(-50%);
  width: min(320px, calc(100% - 56px));
}
.crate-legend{
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px 14px;
  max-height: 420px;
  overflow-y: auto;
  padding-right: 8px;
}
.crate-legend-row{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  background: var(--paper-2);
  border-left: 4px solid var(--ink);
}
.crate-legend-thumb{
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.crate-legend-art{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}
.crate-legend-row.locked .crate-legend-art{
  filter: brightness(.42) saturate(.82);
}
.crate-legend-row.owned .crate-legend-art{
  filter: none;
}
.crate-open-btn{
  width: 100%;
  margin-bottom: 18px;
}
.crate-open-btn-hero{
  margin-bottom: 0;
}
.crate-open-backdrop{
  position: fixed;
  inset: 0;
  background: rgba(42,27,27,.74);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 130;
}
.crate-open-shell{
  width: min(920px, 100%);
}
.crate-open-panel{
  position: relative;
  padding: 26px 26px 32px;
  text-align: center;
  overflow: hidden;
}
.crate-open-panel-revealed{
  min-height: 720px;
  display: grid;
  place-items: center;
  align-content: center;
}
.crate-open-panel-sunflare{
  background:
    linear-gradient(180deg, #fff7d8 0%, #ffe39f 58%, #ffc25d 100%);
}
.crate-open-panel-nebula{
  background:
    linear-gradient(180deg, #fff2ff 0%, #ead3ff 58%, #cfabff 100%);
}
.crate-open-panel-verdant{
  background:
    linear-gradient(180deg, #f8ffd8 0%, #ddf1b4 58%, #b9df7e 100%);
}
.crate-open-panel-aurora{
  background:
    linear-gradient(180deg, #f3fbff 0%, #d8ebff 58%, #a9d2ff 100%);
}
.crate-open-panel-revealed::before{
  content:'';
  position:absolute;
  inset:-38%;
  background:
    radial-gradient(circle at center, rgba(255,251,233,.98) 0 10%, rgba(255,245,204,.76) 14%, rgba(255,236,176,.18) 34%, rgba(255,236,176,0) 64%),
    repeating-conic-gradient(from 0deg, rgba(255,224,122,.74) 0deg 11deg, rgba(255,245,215,.06) 11deg 22deg),
    radial-gradient(circle at center, rgba(255,188,88,.16) 0 24%, rgba(255,152,103,.08) 38%, rgba(255,152,103,0) 76%);
  animation: crateRayShift 4.2s ease-in-out infinite alternate;
  z-index: 0;
  pointer-events: none;
}
.crate-open-meta,
.crate-open-stage,
.crate-open-title,
.crate-open-subtitle,
.crate-reveal-card{
  position: relative;
  z-index: 1;
}
.crate-open-meta{
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 18px;
}
.crate-open-panel-revealed .crate-open-meta{
  position: absolute;
  inset: 22px 22px auto 22px;
  margin-bottom: 0;
}
.crate-modal-close{
  background: rgba(42,27,27,.88);
}
.crate-open-stage{
  min-height: 430px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.crate-open-image{
  width: min(320px, 68vw);
  height: auto;
  image-rendering: pixelated;
  filter: drop-shadow(0 24px 0 rgba(255,161,56,.22));
}
.crate-open-title{
  font-size: 22px;
  margin-bottom: 10px;
}
.crate-open-subtitle{
  font-size: 24px;
  opacity: .8;
}
.crate-reveal-card{
  margin: 0 auto;
  max-width: 420px;
  width: min(420px, 100%);
  background: transparent;
  padding: 20px 22px 24px;
}
.crate-auth-code{
  margin: 0 auto 18px;
  max-width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,.52);
  border: 3px solid rgba(42,27,27,.22);
}
.crate-auth-code-label{
  font-size: 9px;
  color: var(--coral-deep);
  margin-bottom: 8px;
}
.crate-auth-code-value{
  font-size: 17px;
  line-height: 1.3;
  word-break: break-all;
}
.crate-reveal-art{
  width: 196px;
  height: 196px;
  margin: 0 auto 18px;
  background: rgba(255,255,255,.16);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 0 18px rgba(255,255,255,.08),
    0 0 48px rgba(255,245,214,.92);
}
@keyframes crateShake{
  0%{transform: translateX(0) rotate(0deg)}
  16%{transform: translateX(-16px) rotate(-5deg)}
  32%{transform: translateX(16px) rotate(5deg)}
  48%{transform: translateX(-12px) rotate(-4deg)}
  64%{transform: translateX(12px) rotate(4deg)}
  80%{transform: translateX(-6px) rotate(-2deg)}
  100%{transform: translateX(0) rotate(0deg)}
}
.crate-open-stage.shake{
  animation: crateShake .95s steps(6) 1;
}
@keyframes crateRayShift{
  0%{
    filter: hue-rotate(0deg) saturate(1);
    opacity: .92;
    transform: scale(1);
  }
  100%{
    filter: hue-rotate(34deg) saturate(1.18);
    opacity: 1;
    transform: scale(1.04);
  }
}

/* legal page typography */
.legal{
  background: var(--white);
  padding: 40px 44px;
  max-width: 820px; margin: 0 auto;
  font-size: 18px;
  line-height: 1.6;
}
.legal h1{ font-family:'PressStart', monospace; font-size: 22px; margin-bottom: 8px }
.legal h2{ font-family:'PressStart', monospace; font-size: 12px; margin: 28px 0 8px; color: var(--coral) }
.legal h3{ font-family:'PressStart', monospace; font-size: 10px; margin: 18px 0 6px }
.legal p{ margin-bottom: 12px }
.legal ul{ padding-left: 22px; margin-bottom: 12px }
.legal li{ margin-bottom: 4px }
.legal .meta{ font-family:'PressStart', monospace; font-size: 9px; color:#888 }

/* avatar stage */
.stage{
  background:
    radial-gradient(ellipse at 50% 70%, rgba(255,184,200,.6) 0%, transparent 50%),
    linear-gradient(to bottom, var(--sky) 0%, var(--pink-neon) 60%, var(--lemon) 100%);
  position:relative;
  overflow:hidden;
  min-height: 540px;
  display:flex; align-items:flex-end; justify-content:center;
}
.stage .star{
  position:absolute; width:8px; height:8px;
  background: var(--white);
  clip-path: polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
}

/* split view */
.split{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  background: var(--white);
}
@media (max-width: 800px){
  .split{ grid-template-columns: 1fr }
  .crate-detail-split{ grid-template-columns: 1fr; }
  .crate-detail-hero{ border-right: none; border-bottom: 4px solid var(--ink); min-height: 320px; }
  .crate-detail-open-wrap{ bottom: 56px; width: min(320px, calc(100% - 36px)); }
  .crate-legend{ grid-template-columns: 1fr; }
}

/* stat row */
.stat-row{
  display:flex; justify-content:space-between; align-items:center;
  padding: 10px 0;
  border-bottom: 2px dotted var(--ink);
}
.stat-row:last-child{ border-bottom: none }
.stat-key{
  font-family:'PressStart', monospace;
  font-size: 10px; letter-spacing:.04em;
}
.stat-val{ font-size: 20px }

/* gridfloor */
.gridfloor{
  position:absolute; left:0; right:0; bottom:0; height: 60%;
  background:
    linear-gradient(to top, var(--coral) 0%, transparent 100%),
    repeating-linear-gradient(0deg, transparent 0 24px, rgba(255,255,255,.4) 24px 26px),
    repeating-linear-gradient(90deg, transparent 0 24px, rgba(255,255,255,.4) 24px 26px);
  transform: perspective(400px) rotateX(60deg);
  transform-origin: top;
  opacity:.5;
}

/* badge ribbons */
.ribbon{
  position:absolute; top:-6px; right:-6px;
  background: var(--coral);
  color: var(--white);
  padding: 6px 8px;
  font-family:'PressStart', monospace; font-size:9px;
  z-index: 2;
  box-shadow: 0 0 0 3px var(--ink);
}
.ribbon.gold{ background: #F4C53C; color: var(--ink) }
.ribbon.purple{ background: var(--lavender); color: var(--ink) }
.ribbon.mint{ background: var(--mint); color: var(--ink) }

/* clickable rows */
.row-list{
  display:flex; flex-direction:column; gap:12px;
}
.row-list .row{
  display:grid; grid-template-columns: 60px 1fr auto; gap:14px; align-items:center;
  background: var(--white); padding: 12px;
  cursor:pointer;
}
.row-list .row:hover{ background: var(--paper-2) }
.row-list .row.active{ background: var(--ink); color: var(--white) }
.row-list .row.active .stat-key{ color: var(--coral-soft) }

/* tooltip */
.kbd{
  font-family:'PressStart', monospace; font-size:9px;
  border:2px solid var(--ink);
  padding: 3px 6px;
  background: var(--white);
  display:inline-block;
}

  /* override PressStart class to use Google's font reliably */
  .pixel, .pxl-btn, .chip, .opt, .nav .link, .nav .logo span,
  .legal h1, .legal h2, .legal h3, .stat-key, .ribbon, .kbd, .foot {
    font-family: 'Press Start 2P', 'VT323', monospace !important;
  }
</style>
</head>

  const buckets = createCrateBuckets();
  const grouped = new Map();

  NON_STARTER_NFT_LIBRARY.forEach((item) => {
    const key = `${item.slot}:${item.rarity}`;
    if (!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(item);
  });

  grouped.forEach((items, key) => {
    const [slot, rarity] = key.split(':');
    const startIndex = (RARITY_OFFSET[rarity] || 0) + (SLOT_OFFSET[slot] || 0);
    items.forEach((item, index) => {
      const targetIndex = (startIndex + index) % buckets.length;
      buckets[targetIndex].contents.push({
        ...item,
        crateRarity: item.rarity,
      });
    });
  });

  buckets.forEach((crate) => {
    crate.contents.sort((left, right) => {
      const rarityDelta = RARITY_ORDER.indexOf(left.rarity) - RARITY_ORDER.indexOf(right.rarity);
      if (rarityDelta !== 0) return rarityDelta;

      const slotDelta = SLOT_ORDER.indexOf(left.slot) - SLOT_ORDER.indexOf(right.slot);
      if (slotDelta !== 0) return slotDelta;

      return left.name.localeCompare(right.name);
    });

    crate.rarityCounts = crate.contents.reduce((counts, item) => {
      counts[item.rarity] = (counts[item.rarity] || 0) + 1;
      return counts;
    }, {});
  });

  return buckets;
};

const CRATE_LIBRARY = buildCratesFromGeneratedGear();

const RARITY_COLOR = {
  Common: 'pink',
  Rare: 'sky',
  Epic: 'lavender',
  Legendary: 'coral',
};

window.NFT_LIBRARY = NFT_LIBRARY;
window.BROWSABLE_NFT_LIBRARY = BROWSABLE_NFT_LIBRARY;
window.CRATE_LIBRARY = CRATE_LIBRARY;
window.CRATE_PRICE_VTO = CRATE_PRICE_VTO;
window.RARITY_COLOR = RARITY_COLOR;
window.IMAGE_GEAR_MAP = IMAGE_GEAR_MAP;

</script>

<script type="text/babel">
/* ============= Backend auth + local wardrobe progression ============= */

const AUTH_ACCOUNTS_STORAGE_KEY = 'wardrobeforge-auth-accounts-v1';
const AUTH_SESSION_STORAGE_KEY = 'wardrobeforge-auth-session-v2';
const AUTH_CHANGE_EVENT = 'wardrobeforge-auth-change';
const AUTH_VTO_GRANT_KEY = 'wardrobeforge-vto-grant-300-v1';
const AUTH_TEST_VTO_BONUS_KEY = 'wardrobeforge-test-vto-bonus-500-v1';
const AUTH_BACKEND_URL_STORAGE_KEY = 'wardrobeforge-backend-url';
const STARTER_OWNED_ART_IDS = ['base-outfit', 'base-shoes'];
const STARTER_VTO_BALANCE = 300;
const STARTER_ACCOUNT_XP = 0;
const TEST_VTO_BONUS = 500;
const DEFAULT_BACKEND_BASE_URL = 'http://localhost:8001';
const AUTHENTICITY_CODE_PART_LENGTH = 10;
const AUTHENTICITY_CODE_PARTS = 4;
const AUTHENTICITY_CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

const normalizeEmail = (email) => String(email || '').trim().toLowerCase();
const trimValue = (value) => String(value || '').trim();

const getBackendBaseUrl = () => {
  const queryParamValue = new URLSearchParams(window.location.search).get('backend');
  const configuredBaseUrl =
    trimValue(window.WardrobeForgeConfig?.backendUrl) ||
    trimValue(queryParamValue) ||
    trimValue(window.localStorage.getItem(AUTH_BACKEND_URL_STORAGE_KEY)) ||
    DEFAULT_BACKEND_BASE_URL;

  return configuredBaseUrl.replace(/\/+$/, '');
};

const setBackendBaseUrl = (nextBaseUrl) => {
  const cleanBaseUrl = trimValue(nextBaseUrl).replace(/\/+$/, '');

  if (!cleanBaseUrl) {
    window.localStorage.removeItem(AUTH_BACKEND_URL_STORAGE_KEY);
    return getBackendBaseUrl();
  }

  window.localStorage.setItem(AUTH_BACKEND_URL_STORAGE_KEY, cleanBaseUrl);
  return cleanBaseUrl;
};

const normalizeUser = (user) => {
  if (!user || typeof user !== 'object') return null;

  const id = trimValue(user.id || user._id);
  const username = trimValue(user.username || user.displayName);
  const email = normalizeEmail(user.email);

  if (!id || !username || !email) return null;

  return {
    id,
    username,
    displayName: trimValue(user.displayName || username),
    email,
    createdAt: user.createdAt || user.created_at || new Date().toISOString(),
  };
};

const sanitizeUser = (user) => {
  const normalizedUser = normalizeUser(user);
  return normalizedUser
    ? {
        id: normalizedUser.id,
        username: normalizedUser.username,
        displayName: normalizedUser.displayName,
        email: normalizedUser.email,
        createdAt: normalizedUser.createdAt,
      }
    : null;
};

const readStoredAccounts = () => {
  try {
    const raw = window.localStorage.getItem(AUTH_ACCOUNTS_STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed.filter((entry) => entry && typeof entry === 'object') : [];
  } catch (error) {
    return [];
  }
};

const writeStoredAccounts = (accounts) => {
  window.localStorage.setItem(AUTH_ACCOUNTS_STORAGE_KEY, JSON.stringify(accounts));
};

const getUserBalanceValue = (account) => {
  const balance = Number(account?.vtoBalance);
  return Number.isFinite(balance) ? balance : STARTER_VTO_BALANCE;
};

const getUserOwnedArtIdsValue = (account) => {
  const ownedArtIds = Array.isArray(account?.ownedArtIds) ? account.ownedArtIds.filter(Boolean) : [];
  return ownedArtIds.length ? [...new Set(ownedArtIds)] : [...STARTER_OWNED_ART_IDS];
};

const getUserItemStarsValue = (account) => {
  const ownedArtIds = getUserOwnedArtIdsValue(account);
  const rawStars = account?.itemStars && typeof account.itemStars === 'object' ? account.itemStars : {};
  return ownedArtIds.reduce((stars, artId) => {
    const value = Number(rawStars[artId]);
    stars[artId] = Number.isFinite(value) ? Math.max(1, Math.min(3, value)) : 1;
    return stars;
  }, {});
};

const createRandomAuthenticityChunk = (length = AUTHENTICITY_CODE_PART_LENGTH) => {
  const cryptoApi = window.crypto || window.msCrypto;

  if (cryptoApi?.getRandomValues) {
    const values = new Uint32Array(length);
    cryptoApi.getRandomValues(values);
    return Array.from(values, (value) => AUTHENTICITY_CODE_ALPHABET[value % AUTHENTICITY_CODE_ALPHABET.length]).join('');
  }

  return Array.from({ length }, () => (
    AUTHENTICITY_CODE_ALPHABET[Math.floor(Math.random() * AUTHENTICITY_CODE_ALPHABET.length)]
  )).join('');
};

const createAuthenticityCode = (usedCodes = new Set()) => {
  let nextCode = '';

  do {
    nextCode = `wf_live_${Array.from({ length: AUTHENTICITY_CODE_PARTS }, () => createRandomAuthenticityChunk()).join('_')}`;
  } while (usedCodes.has(nextCode));

  return nextCode;
};

const getUserAuthenticityCodesValue = (account) => {
  const ownedArtIds = getUserOwnedArtIdsValue(account);
  const rawCodes = account?.authenticityCodes && typeof account.authenticityCodes === 'object' ? account.authenticityCodes : {};
  const usedCodes = new Set(
    Object.values(rawCodes)
      .filter((value) => typeof value === 'string')
      .map((value) => value.trim())
      .filter(Boolean),
  );

  return ownedArtIds.reduce((codes, artId) => {
    const existingCode = typeof rawCodes[artId] === 'string' ? rawCodes[artId].trim() : '';
    const nextCode = existingCode || createAuthenticityCode(usedCodes);
    usedCodes.add(nextCode);
    codes[artId] = nextCode;
    return codes;
  }, {});
};

const getUserXpValue = (account) => {
  const xp = Number(account?.xp);
  return Number.isFinite(xp) ? xp : STARTER_ACCOUNT_XP;
};

const readStoredSession = () => {
  try {
    const raw = window.localStorage.getItem(AUTH_SESSION_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    const user = sanitizeUser(parsed?.user);
    const token = trimValue(parsed?.token);

    if (!user || !token) return null;

    return {
      token,
      user,
      loggedInAt: parsed?.loggedInAt || null,
    };
  } catch (error) {
    return null;
  }
};

const getCurrentUser = () => sanitizeUser(readStoredSession()?.user);

const dispatchAuthChange = (user) => {
  window.dispatchEvent(new CustomEvent(AUTH_CHANGE_EVENT, { detail: { user } }));
};

const upsertLocalAccountState = (user) => {
  const normalizedUser = normalizeUser(user);
  if (!normalizedUser) return null;

  const accounts = readStoredAccounts();
  const matchingIndex = accounts.findIndex((entry) => entry && entry.id === normalizedUser.id);
  const legacyEmailIndex = matchingIndex < 0
    ? accounts.findIndex((entry) => normalizeEmail(entry?.email) === normalizedUser.email)
    : -1;
  const sourceIndex = matchingIndex >= 0 ? matchingIndex : legacyEmailIndex;
  const sourceAccount = sourceIndex >= 0 ? accounts[sourceIndex] : null;

  const nextAccount = {
    id: normalizedUser.id,
    username: normalizedUser.username,
    displayName: normalizedUser.displayName,
    email: normalizedUser.email,
    createdAt: sourceAccount?.createdAt || normalizedUser.createdAt,
    ownedArtIds: getUserOwnedArtIdsValue(sourceAccount),
    itemStars: getUserItemStarsValue(sourceAccount),
    authenticityCodes: getUserAuthenticityCodesValue(sourceAccount),
    vtoBalance: getUserBalanceValue(sourceAccount),
    xp: getUserXpValue(sourceAccount),
  };

  const nextAccounts = [
    nextAccount,
    ...accounts.filter((entry, index) => index !== matchingIndex && index !== legacyEmailIndex),
  ];

  writeStoredAccounts(nextAccounts);
  return nextAccount;
};

const getAccountById = (userId) => {
  const cleanUserId = trimValue(userId);
  if (!cleanUserId) return null;

  return readStoredAccounts().find((entry) => entry && entry.id === cleanUserId) || null;
};

const updateStoredAccount = (userId, mutator) => {
  const cleanUserId = trimValue(userId);
  const currentUser = getCurrentUser();
  const baseUser = cleanUserId === currentUser?.id ? currentUser : sanitizeUser(getAccountById(cleanUserId));

  if (!baseUser) {
    throw new Error('Account not found.');
  }

  const currentAccount = upsertLocalAccountState(baseUser);
  const nextAccount = mutator({
    ...currentAccount,
    ownedArtIds: getUserOwnedArtIdsValue(currentAccount),
    itemStars: getUserItemStarsValue(currentAccount),
    authenticityCodes: getUserAuthenticityCodesValue(currentAccount),
    vtoBalance: getUserBalanceValue(currentAccount),
    xp: getUserXpValue(currentAccount),
  });

  const accounts = readStoredAccounts();
  const accountIndex = accounts.findIndex((entry) => entry && entry.id === cleanUserId);

  if (accountIndex < 0) {
    throw new Error('Account not found.');
  }

  accounts[accountIndex] = {
    id: cleanUserId,
    username: trimValue(nextAccount.username || baseUser.username),
    displayName: trimValue(nextAccount.displayName || baseUser.displayName),
    email: normalizeEmail(nextAccount.email || baseUser.email),
    createdAt: nextAccount.createdAt || baseUser.createdAt,
    ownedArtIds: getUserOwnedArtIdsValue(nextAccount),
    itemStars: getUserItemStarsValue(nextAccount),
    authenticityCodes: getUserAuthenticityCodesValue(nextAccount),
    vtoBalance: getUserBalanceValue(nextAccount),
    xp: getUserXpValue(nextAccount),
  };
  writeStoredAccounts(accounts);

  if (currentUser?.id === cleanUserId) {
    dispatchAuthChange(sanitizeUser(currentUser));
  }

  return accounts[accountIndex];
};

const getAccountSnapshot = (userId = null) => {
  const resolvedUserId = userId || getCurrentUser()?.id;
  if (!resolvedUserId) {
    return {
      balance: STARTER_VTO_BALANCE,
      xp: STARTER_ACCOUNT_XP,
      ownedArtIds: [...STARTER_OWNED_ART_IDS],
      itemStars: Object.fromEntries(STARTER_OWNED_ART_IDS.map((artId) => [artId, 1])),
      authenticityCodes: getUserAuthenticityCodesValue({ ownedArtIds: STARTER_OWNED_ART_IDS }),
    };
  }

  const account = getAccountById(resolvedUserId);
  return {
    balance: getUserBalanceValue(account),
    xp: getUserXpValue(account),
    ownedArtIds: getUserOwnedArtIdsValue(account),
    itemStars: getUserItemStarsValue(account),
    authenticityCodes: getUserAuthenticityCodesValue(account),
  };
};

const getScopedStorageKey = (baseKey, userId = null) => {
  const scopedUserId = userId || getCurrentUser()?.id;
  return scopedUserId ? `${baseKey}:${scopedUserId}` : `${baseKey}:guest`;
};

const createApiError = (message, status = null) => {
  const error = new Error(message);
  if (status) error.status = status;
  return error;
};

const apiRequest = async (path, { method = 'GET', body = null, token = null } = {}) => {
  const requestInit = {
    method,
    headers: {},
  };

  if (body !== null) {
    requestInit.headers['Content-Type'] = 'application/json';
    requestInit.body = JSON.stringify(body);
  }

  if (token) {
    requestInit.headers.Authorization = `Bearer ${token}`;
  }

  let response = null;
  try {
    response = await fetch(`${getBackendBaseUrl()}/api${path}`, requestInit);
  } catch (error) {
    throw createApiError(
      `Could not reach the backend at ${getBackendBaseUrl()}. Make sure the w-react API is running.`,
      0,
    );
  }

  let payload = null;
  try {
    payload = await response.json();
  } catch (error) {
    payload = null;
  }

  if (!response.ok) {
    throw createApiError(
      payload?.detail || payload?.message || `Request failed with status ${response.status}.`,
      response.status,
    );
  }

  return payload;
};

const getCurrentToken = () => trimValue(readStoredSession()?.token);

const getPerUserFlagKey = (baseKey, userId) => `${baseKey}:${userId}`;

const applyOneTimeVtoGrant = () => {
  try {
    const sessionUser = getCurrentUser();
    if (!sessionUser?.id) return;

    const grantKey = getPerUserFlagKey(AUTH_VTO_GRANT_KEY, sessionUser.id);
    if (window.localStorage.getItem(grantKey)) return;

    updateStoredAccount(sessionUser.id, (account) => ({
      ...account,
      vtoBalance: Math.max(STARTER_VTO_BALANCE, getUserBalanceValue(account)),
    }));

    window.localStorage.setItem(grantKey, '1');
  } catch (error) {
    // Keep auth usable even if the local grant cannot be applied.
  }
};

const applyOneTimeTestVtoBonus = () => {
  try {
    const sessionUser = getCurrentUser();
    if (!sessionUser?.id) return;

    const bonusKey = getPerUserFlagKey(AUTH_TEST_VTO_BONUS_KEY, sessionUser.id);
    if (window.localStorage.getItem(bonusKey)) return;

    updateStoredAccount(sessionUser.id, (account) => ({
      ...account,
      vtoBalance: getUserBalanceValue(account) + TEST_VTO_BONUS,
    }));

    window.localStorage.setItem(bonusKey, '1');
  } catch (error) {
    // Keep auth usable even if the local test bonus cannot be applied.
  }
};

const setCurrentUser = (sessionData) => {
  if (!sessionData) {
    window.localStorage.removeItem(AUTH_SESSION_STORAGE_KEY);
    dispatchAuthChange(null);
    return null;
  }

  const user = sanitizeUser(sessionData.user || sessionData);
  const token = trimValue(sessionData.token || sessionData.access_token);

  if (!user || !token) {
    throw new Error('Missing session data from backend.');
  }

  upsertLocalAccountState(user);
  window.localStorage.setItem(
    AUTH_SESSION_STORAGE_KEY,
    JSON.stringify({
      token,
      user,
      loggedInAt: sessionData.loggedInAt || new Date().toISOString(),
    }),
  );

  applyOneTimeVtoGrant();
  applyOneTimeTestVtoBonus();
  dispatchAuthChange(user);
  return user;
};

const sendVerificationCode = async (email) => {
  const cleanEmail = normalizeEmail(email);

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
    throw new Error('Enter a valid email address.');
  }

  return apiRequest('/auth/send-verification-code', {
    method: 'POST',
    body: { email: cleanEmail },
  });
};

const signUp = async ({ displayName, email, password, verificationCode, agreeToTerms, subscribeToNews }) => {
  const cleanName = trimValue(displayName);
  const cleanEmail = normalizeEmail(email);
  const cleanPassword = String(password || '');
  const cleanVerificationCode = trimValue(verificationCode);

  if (cleanName.length < 3) {
    throw new Error('Username must be at least 3 characters.');
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
    throw new Error('Enter a valid email address.');
  }
  if (cleanPassword.length < 6) {
    throw new Error('Password must be at least 6 characters.');
  }
  if (!cleanVerificationCode) {
    throw new Error('Enter the verification code from your email.');
  }
  if (!agreeToTerms) {
    throw new Error('You must agree to the terms and conditions.');
  }

  const result = await apiRequest('/auth/signup', {
    method: 'POST',
    body: {
      username: cleanName,
      password: cleanPassword,
      email: cleanEmail,
      verification_code: cleanVerificationCode,
      agree_to_terms: Boolean(agreeToTerms),
      subscribe_to_news: Boolean(subscribeToNews),
    },
  });

  return setCurrentUser({
    token: result?.access_token,
    user: result?.user,
  });
};

const logIn = async ({ email, password }) => {
  const identifier = trimValue(email);
  const cleanPassword = String(password || '');

  if (!identifier) {
    throw new Error('Enter your email or username.');
  }
  if (!cleanPassword) {
    throw new Error('Enter your password.');
  }

  const result = await apiRequest('/auth/login', {
    method: 'POST',
    body: {
      identifier,
      password: cleanPassword,
    },
  });

  return setCurrentUser({
    token: result?.access_token,
    user: result?.user,
  });
};

const refreshSession = async () => {
  const session = readStoredSession();
  if (!session?.token) return null;

  try {
    const user = await apiRequest('/auth/me', {
      token: session.token,
    });

    return setCurrentUser({
      token: session.token,
      user,
      loggedInAt: session.loggedInAt,
    });
  } catch (error) {
    if (error?.status === 401) {
      logOut();
      return null;
    }

    throw error;
  }
};

const logOut = () => {
  setCurrentUser(null);
};

const addVtoBalance = ({ userId, amount }) => {
  const nextAccount = updateStoredAccount(userId, (account) => ({
    ...account,
    vtoBalance: getUserBalanceValue(account) + Math.max(0, Number(amount) || 0),
  }));

  return {
    balance: getUserBalanceValue(nextAccount),
    xp: getUserXpValue(nextAccount),
    ownedArtIds: getUserOwnedArtIdsValue(nextAccount),
    itemStars: getUserItemStarsValue(nextAccount),
  };
};

const spendVtoAndGrantItem = ({ userId, cost, artId, xpAmount = 0 }) => {
  let grantedAuthenticityCode = '';
  const nextAccount = updateStoredAccount(userId, (account) => {
    const balance = getUserBalanceValue(account);
    if (balance < cost) {
      throw new Error('Insufficient funds.');
    }

    const ownedArtIds = new Set(getUserOwnedArtIdsValue(account));
    const itemStars = { ...getUserItemStarsValue(account) };
    const authenticityCodes = { ...getUserAuthenticityCodesValue(account) };
    if (artId) {
      const alreadyOwned = ownedArtIds.has(artId);
      ownedArtIds.add(artId);
      itemStars[artId] = alreadyOwned ? Math.min(3, (itemStars[artId] || 1) + 1) : 1;
      if (!authenticityCodes[artId]) {
        authenticityCodes[artId] = createAuthenticityCode(new Set(Object.values(authenticityCodes)));
      }
      grantedAuthenticityCode = authenticityCodes[artId];
    }

    return {
      ...account,
      vtoBalance: balance - cost,
      xp: getUserXpValue(account) + Math.max(0, Number(xpAmount) || 0),
      ownedArtIds: [...ownedArtIds],
      itemStars,
      authenticityCodes,
    };
  });

  return {
    balance: getUserBalanceValue(nextAccount),
    xp: getUserXpValue(nextAccount),
    ownedArtIds: getUserOwnedArtIdsValue(nextAccount),
    itemStars: getUserItemStarsValue(nextAccount),
    authenticityCodes: getUserAuthenticityCodesValue(nextAccount),
    grantedAuthenticityCode,
  };
};

const AuthPanel = ({ goto, embedded = false, onClose = null, onSuccess = null }) => {
  const [mode, setMode] = React.useState('signup');
  const [displayName, setDisplayName] = React.useState('');
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [verificationCode, setVerificationCode] = React.useState('');
  const [agreeToTerms, setAgreeToTerms] = React.useState(false);
  const [subscribeToNews, setSubscribeToNews] = React.useState(true);
  const [error, setError] = React.useState('');
  const [success, setSuccess] = React.useState('');
  const [busyAction, setBusyAction] = React.useState('');
  const currentUser = getCurrentUser();
  const isBusy = Boolean(busyAction);

  React.useEffect(() => {
    setError('');
    setSuccess('');
  }, [mode]);

  const handleSendCode = async () => {
    setError('');
    setSuccess('');
    setBusyAction('code');

    try {
      await sendVerificationCode(email);
      setSuccess(`Verification code sent to ${normalizeEmail(email)}.`);
    } catch (nextError) {
      setError(nextError.message || 'Could not send verification code.');
    } finally {
      setBusyAction('');
    }
  };

  const handleSubmit = async (event) => {
    event.preventDefault();
    setError('');
    setSuccess('');
    setBusyAction(mode);

    try {
      let user = null;
      if (mode === 'signup') {
        user = await signUp({
          displayName,
          email,
          password,
          verificationCode,
          agreeToTerms,
          subscribeToNews,
        });
        setSuccess(`Welcome, ${user.displayName}. Your backend account is live.`);
      } else {
        user = await logIn({ email, password });
        setSuccess(`Welcome back, ${user.displayName}.`);
      }

      setPassword('');
      if (onSuccess) onSuccess(user);
      if (goto) {
        window.setTimeout(() => {
          goto('avatar');
        }, 250);
      }
    } catch (nextError) {
      setError(nextError.message || 'Something went wrong.');
    } finally {
      setBusyAction('');
    }
  };

  const handleLogout = () => {
    logOut();
    setSuccess('You have been signed out.');
    setError('');
  };

  return (
    <div className={embedded ? 'auth-hero auth-hero-embedded' : 'auth-hero'}>
      <div className="pxl-box auth-card auth-card-main">
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, flexWrap: 'wrap', marginBottom: 18 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, flexWrap: 'wrap', flex: 1 }}>
            <h1 className="pixel" style={{ fontSize: 26 }}>ACCOUNT ACCESS</h1>
          </div>
          {embedded && onClose && (
            <button className="auth-modal-close" onClick={onClose} aria-label="Close sign in popup">X</button>
          )}
        </div>

        {currentUser ? (
          <div className="auth-session">
            <div className="chip coral" style={{ marginBottom: 14 }}>SIGNED IN</div>
            <div className="pixel" style={{ fontSize: 18, marginBottom: 8 }}>{currentUser.displayName}</div>
            <div className="mono" style={{ fontSize: 20, opacity: 0.75, marginBottom: 6 }}>{currentUser.email}</div>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <button className="pxl-btn" onClick={() => goto && goto('avatar')}>OPEN WARDROBE</button>
              <button className="pxl-btn ghost" onClick={handleLogout}>LOG OUT</button>
            </div>
            {success && <div className="auth-feedback auth-feedback-success">{success}</div>}
          </div>
        ) : (
          <div className="auth-shell">
            <div className="opts" style={{ marginBottom: 18 }}>
              <button className={`opt ${mode === 'signup' ? 'active coral' : ''}`} onClick={() => setMode('signup')} disabled={isBusy}>SIGN UP</button>
              <button className={`opt ${mode === 'login' ? 'active' : ''}`} onClick={() => setMode('login')} disabled={isBusy}>LOG IN</button>
            </div>

            <form className="auth-form" onSubmit={handleSubmit}>
              {mode === 'signup' && (
                <label className="auth-field">
                  <span className="pixel">USERNAME</span>
                  <input
                    value={displayName}
                    onChange={(event) => setDisplayName(event.target.value)}
                    placeholder="PixelWanderer"
                    disabled={isBusy}
                  />

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">
/* ============= Pixel art renderer ============= */
/* Render small pixel art via CSS box-shadows from a 2D string array.
   Each character = a color key in the supplied palette.
   '.' = transparent. */

const PixelArt = ({ data, palette, scale = 4, style = {} }) => {
  const rows = data.length;
  const cols = data[0].length;
  // build box-shadow string
  const shadows = [];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const ch = data[y][x];
      if (ch === '.' || ch === ' ') continue;
      const c = palette[ch];
      if (!c) continue;
      shadows.push(`${x * scale}px ${y * scale}px 0 ${c}`);
    }
  }
  return (
    <div
      aria-hidden="true"
      style={{
        position: 'relative',
        width: cols * scale,
        height: rows * scale,
        ...style,
      }}
    >
      <div
        style={{
          width: scale,
          height: scale,
          boxShadow: shadows.join(','),
          background: 'transparent',

  );

<script type="text/babel">
/* ============= Image Pixelizer Component ============= */
/* Convert uploaded images into editable pixel grids with live preview. */

const PixelizerUtils = {
  quantize(imageData, numColors) {
    const pixels = [];
    for (let i = 0; i < imageData.data.length; i += 4) {
      if (imageData.data[i + 3] > 128) {
        pixels.push([imageData.data[i], imageData.data[i + 1], imageData.data[i + 2]]);
      }
    }

    if (pixels.length === 0) return [];

    let palette = [];
    const step = Math.max(1, Math.floor(pixels.length / numColors));
    for (let i = 0; i < numColors && i * step < pixels.length; i++) {
      palette.push(pixels[i * step]);
    }

    for (let iter = 0; iter < 4; iter++) {
      const clusters = palette.map(() => ({ sum: [0, 0, 0], count: 0 }));
      for (const pixel of pixels) {
        let best = 0;
        let bestDistance = Infinity;
        for (let j = 0; j < palette.length; j++) {
          const distance = this.colorDist(pixel, palette[j]);
          if (distance < bestDistance) {
            bestDistance = distance;
            best = j;
          }
        }

        clusters[best].sum[0] += pixel[0];
        clusters[best].sum[1] += pixel[1];
        clusters[best].sum[2] += pixel[2];
        clusters[best].count++;
      }

      palette = clusters.map((cluster, index) =>
        cluster.count > 0
          ? [
              cluster.sum[0] / cluster.count,
              cluster.sum[1] / cluster.count,
              cluster.sum[2] / cluster.count,
            ]
          : palette[index]
      );
    }

    return palette.map((color) => color.map(Math.round));
  },

  colorDist(a, b) {
    return (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;
  },

  closestColor(r, g, b, palette) {
    let best = 0;
    let bestDistance = Infinity;
    for (let i = 0; i < palette.length; i++) {
      const distance = this.colorDist([r, g, b], palette[i]);
      if (distance < bestDistance) {
        bestDistance = distance;
        best = i;
      }
    }
    return palette[best];
  },

  rgbToHex(r, g, b) {
    return '#' + [r, g, b].map((value) => {
      const hex = Math.round(value).toString(16);
      return hex.length === 1 ? '0' + hex : hex;
    }).join('');
  },

  hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? [
      parseInt(result[1], 16),
      parseInt(result[2], 16),
      parseInt(result[3], 16),
    ] : [0, 0, 0];
  },

  luminance(hex) {
    const [r, g, b] = this.hexToRgb(hex);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  },

  saturation(hex) {
    const [r, g, b] = this.hexToRgb(hex);
    return Math.max(r, g, b) - Math.min(r, g, b);
  },

  drawPixelDataToCanvas(canvas, pixelData, pixelScale = 1) {
    if (!canvas || !pixelData) return;
    const { grid, width, height } = pixelData;
    canvas.width = width * pixelScale;
    canvas.height = height * pixelScale;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const pixel = grid[y][x];
        if (!pixel || pixel.transparent) continue;
        ctx.fillStyle = pixel.hex;
        ctx.fillRect(x * pixelScale, y * pixelScale, pixelScale, pixelScale);
      }
    }
  },

  backgroundMaskFromEdges(pixelData, tolerance = 22) {
    const { grid, width, height } = pixelData;
    const visited = Array.from({ length: height }, () => Array(width).fill(false));
    const mask = Array.from({ length: height }, () => Array(width).fill(false));
    const queue = [];

    const edgePixels = [];
    for (let x = 0; x < width; x++) {
      if (grid[0] && grid[0][x] && !grid[0][x].transparent) edgePixels.push(grid[0][x]);
      if (grid[height - 1] && grid[height - 1][x] && !grid[height - 1][x].transparent) edgePixels.push(grid[height - 1][x]);
    }
    for (let y = 1; y < height - 1; y++) {
      if (grid[y] && grid[y][0] && !grid[y][0].transparent) edgePixels.push(grid[y][0]);
      if (grid[y] && grid[y][width - 1] && !grid[y][width - 1].transparent) edgePixels.push(grid[y][width - 1]);
    }

    const edgeColorCounts = new Map();
    edgePixels.forEach((pixel) => {
      edgeColorCounts.set(pixel.hex, (edgeColorCounts.get(pixel.hex) || 0) + 1);
    });

    const dominantEdgeColors = [...edgeColorCounts.entries()]
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(([hex]) => {
        const [r, g, b] = this.hexToRgb(hex);
        return { hex, rgb: [r, g, b] };
      });

    const seedPoints = [
      [0, 0], [width - 1, 0], [0, height - 1], [width - 1, height - 1],
      [Math.floor(width / 2), 0], [Math.floor(width / 2), height - 1],
      [0, Math.floor(height / 2)], [width - 1, Math.floor(height / 2)],
    ];

    const matchesBackground = (pixel) => {
      if (!pixel || pixel.transparent) return true;
      return dominantEdgeColors.some((edgeColor) => (
        pixel.hex === edgeColor.hex ||
        this.colorDist([pixel.r, pixel.g, pixel.b], edgeColor.rgb) <= tolerance * tolerance * 3
      ));
    };

    seedPoints.forEach(([x, y]) => {
      if (x >= 0 && x < width && y >= 0 && y < height) queue.push([x, y]);
    });

    while (queue.length) {
      const [x, y] = queue.shift();
      if (x < 0 || y < 0 || x >= width || y >= height || visited[y][x]) continue;
      visited[y][x] = true;

      const pixel = grid[y][x];
      if (!matchesBackground(pixel)) continue;

      mask[y][x] = true;
      queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }

    return mask;
  },

  trimPixelData(pixelData, options = {}) {
    if (!pixelData) return pixelData;
    const { tolerance = 22, padding = 1 } = options;
    const mask = this.backgroundMaskFromEdges(pixelData, tolerance);
    const { grid, width, height } = pixelData;

    let minX = width;
    let minY = height;
    let maxX = -1;
    let maxY = -1;

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const pixel = grid[y][x];
        if (!pixel || pixel.transparent || mask[y][x]) continue;
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }

    if (maxX === -1 || maxY === -1) return pixelData;

    minX = Math.max(0, minX - padding);
    minY = Math.max(0, minY - padding);
    maxX = Math.min(width - 1, maxX + padding);
    maxY = Math.min(height - 1, maxY + padding);

    const nextGrid = [];
    const nextPalette = new Set();

    for (let y = minY; y <= maxY; y++) {
      const row = [];
      for (let x = minX; x <= maxX; x++) {
        const pixel = grid[y][x];
        if (!pixel || pixel.transparent || mask[y][x]) {
          row.push({ transparent: true });
        } else {
          row.push(pixel);
          nextPalette.add(pixel.hex);
        }
      }
      nextGrid.push(row);
    }

    return {
      ...pixelData,
      grid: nextGrid,
      width: maxX - minX + 1,
      height: maxY - minY + 1,
      palette: [...nextPalette],
    };
  },

  suggestEditableRegions(pixelData) {
    if (!pixelData) return { skin: [], eyes: [] };

    const skinCounts = new Map();
    const eyeCounts = new Map();
    const { grid, width, height } = pixelData;

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const pixel = grid[y][x];
        if (!pixel || pixel.transparent) continue;

        const color = pixel.hex;
        const lum = this.luminance(color);
        const sat = this.saturation(color);
        const inFaceBand = x >= width * 0.18 && x <= width * 0.82 && y >= height * 0.08 && y <= height * 0.62;
        const inEyeBand = x >= width * 0.12 && x <= width * 0.88 && y >= height * 0.16 && y <= height * 0.48;

        if (inFaceBand && lum > 95 && lum < 245 && sat > 10 && sat < 95) {
          skinCounts.set(color, (skinCounts.get(color) || 0) + 1);
        }

        if (inEyeBand && lum > 25 && lum < 220 && sat > 35) {
          eyeCounts.set(color, (eyeCounts.get(color) || 0) + 1);
        }
      }
    }

    const skin = [...skinCounts.entries()]
      .sort((a, b) => b[1] - a[1] || this.luminance(b[0]) - this.luminance(a[0]))
      .slice(0, 2)
      .map(([color]) => color);

    const eye = [...eyeCounts.entries()]
      .filter(([color]) => !skin.includes(color))
      .sort((a, b) => b[1] - a[1] || this.saturation(b[0]) - this.saturation(a[0]))
      .slice(0, 2)
      .map(([color]) => color);

    return { skin, eyes: eye };
  },

  async pixelateImage(imgElement, blockSize, numColors) {
    const canvas = document.createElement('canvas');
    const maxW = 600;
    let w = imgElement.width;
    let h = imgElement.height;
    if (w > maxW) {
      h = Math.round((h * maxW) / w);
      w = maxW;
    }

    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgElement, 0, 0, w, h);

    const pixW = Math.ceil(w / blockSize);
    const pixH = Math.ceil(h / blockSize);
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = pixW;
    tmpCanvas.height = pixH;
    const tmpCtx = tmpCanvas.getContext('2d');
    tmpCtx.drawImage(canvas, 0, 0, pixW, pixH);

    const imgData = tmpCtx.getImageData(0, 0, pixW, pixH);
    const palette = this.quantize(imgData, numColors);
    const out = tmpCtx.createImageData(pixW, pixH);
    const grid = [];

    for (let y = 0; y < pixH; y++) {
      const row = [];
      for (let x = 0; x < pixW; x++) {
        const index = (y * pixW + x) * 4;
        const alpha = imgData.data[index + 3];

        if (alpha < 128) {
          out.data[index + 3] = 0;
          row.push({ transparent: true });
          continue;
        }

        const [r, g, b] = this.closestColor(
          imgData.data[index],
          imgData.data[index + 1],
          imgData.data[index + 2],
          palette
        );

        out.data[index] = r;
        out.data[index + 1] = g;
        out.data[index + 2] = b;
        out.data[index + 3] = alpha;
        row.push({ r, g, b, hex: this.rgbToHex(r, g, b) });
      }
      grid.push(row);
    }

    tmpCtx.putImageData(out, 0, 0);

    const result = {
      grid,
      palette: palette.map((color) => this.rgbToHex(color[0], color[1], color[2])),
      width: pixW,
      height: pixH,
      previewDataUrl: tmpCanvas.toDataURL('image/png'),
    };

    result.suggestedRegions = this.suggestEditableRegions(result);
    return result;
  },
};

const PixelizedAvatar = ({ pixelData, colorMap = {}, scale = 4, style = {} }) => {
  if (!pixelData) return null;

  const { grid, width, height } = pixelData;
  const shadows = [];

  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const pixel = grid[y][x];
      if (!pixel || pixel.transparent) continue;
      const color = colorMap[pixel.hex] || pixel.hex;
      shadows.push(`${x * scale}px ${y * scale}px 0 ${color}`);
    }
  }

  return (
    <div
      style={{
        position: 'relative',
        width: width * scale,
        height: height * scale,
        ...style,
      }}
    >
      <div
        style={{
          width: scale,
          height: scale,
          boxShadow: shadows.length ? shadows.join(',') : 'none',
          background: 'transparent',
        }}
      />
    </div>
  );
};

const AVATAR_STORAGE_KEY = 'wardrobeforge.avatar.v1';

const getAvatarScopedStorageKey = () => (
  window.WardrobeForgeAuth?.getScopedStorageKey?.(AVATAR_STORAGE_KEY) || AVATAR_STORAGE_KEY
);

const mixHexColors = (fromHex, toHex, amount) => {
  const [r1, g1, b1] = PixelizerUtils.hexToRgb(fromHex);
  const [r2, g2, b2] = PixelizerUtils.hexToRgb(toHex);
  const mix = (from, to) => Math.round(from + (to - from) * amount);
  return PixelizerUtils.rgbToHex(mix(r1, r2), mix(g1, g2), mix(b1, b2));
};

const buildUploadedAvatarColorMap = (editableRegions, skinTones, eyeColors, skinKey, eyeKey) => {
  const colorMap = {};
  const skinTone = skinTones[skinKey] || skinTones.light;
  const eyeColor = eyeColors[eyeKey] || eyeColors.brown;

  const skinColors = [...(editableRegions.skin || [])].sort((a, b) => (
    PixelizerUtils.luminance(a) - PixelizerUtils.luminance(b)
  ));

  if (skinColors.length === 1) {
    colorMap[skinColors[0]] = skinTone.mid;
  } else if (skinColors.length > 1) {
    skinColors.forEach((color, index) => {
      const ratio = skinColors.length === 1 ? 1 : index / (skinColors.length - 1);
      colorMap[color] = mixHexColors(skinTone.shadow, skinTone.mid, ratio);
    });
  }

  (editableRegions.eyes || []).forEach((color) => {
    colorMap[color] = eyeColor;
  });

  return colorMap;
};
